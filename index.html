<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星穹牌局 · STARFALL CARDS</title>
<style>
:root{
  --bg:#070a18; --panel:#0d1330cc; --panel2:#111a3acc;
  --cy:#4ef7ff; --mg:#ff4ef0; --gd:#ffd94e; --ok:#6bff8e; --bad:#ff5a6e;
  --tx:#eaf6ff; --tx2:#9db4d8;
  --com:#c8f0ff; --unc:#6bff8e; --rare:#ff9d4e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0a1030,#04060f);
  color:var(--tx);
  font-family:"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100vw,480px);height:100vh;height:100dvh;height:var(--vh,100dvh);top:var(--vt,0px);
  display:block;touch-action:none}
#vig{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100vw,480px);height:100vh;height:100dvh;height:var(--vh,100dvh);top:var(--vt,0px);
  pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 30%,transparent 55%,rgba(2,4,14,.55) 100%),
             linear-gradient(rgba(4,8,28,.25),rgba(4,8,28,.6))}
#ui{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100vw,480px);height:100vh;height:100dvh;height:var(--vh,100dvh);top:var(--vt,0px);
  z-index:5;pointer-events:none;display:flex;flex-direction:column}
#ui>*{pointer-events:auto}
.hidden{display:none!important}

/* ============ 通用按鈕 ============ */
.btn{display:inline-block;padding:10px 22px;border-radius:12px;border:1px solid rgba(78,247,255,.5);
  background:linear-gradient(160deg,#0e2a45,#0a1830);color:var(--cy);font-size:16px;font-weight:700;
  letter-spacing:1px;cursor:pointer;box-shadow:0 0 12px rgba(78,247,255,.25),inset 0 0 14px rgba(78,247,255,.08);
  transition:transform .08s,box-shadow .15s;text-align:center}
.btn:active{transform:scale(.95)}
.btn.gold{border-color:rgba(255,217,78,.6);color:var(--gd);box-shadow:0 0 12px rgba(255,217,78,.25)}
.btn.danger{border-color:rgba(255,90,110,.5);color:var(--bad);box-shadow:0 0 12px rgba(255,90,110,.2)}
.btn.big{font-size:18px;padding:14px 34px}
.btn:disabled{opacity:.4;filter:grayscale(.6)}

/* ============ 面板 ============ */
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;z-index:10;background:radial-gradient(ellipse at 50% 60%,rgba(16,26,64,.88),rgba(5,8,22,.96));
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.scr.show{display:flex}
.panel{background:var(--panel);border:1px solid rgba(78,247,255,.28);border-radius:18px;
  padding:22px;max-width:430px;width:100%;box-shadow:0 0 30px rgba(0,0,0,.5),inset 0 0 40px rgba(78,247,255,.04);
  margin:auto}
.title-logo{font-size:44px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(120deg,var(--cy),var(--mg) 55%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(78,247,255,.35);margin-bottom:4px}
.title-sub{color:var(--tx2);letter-spacing:3px;font-size:14px;margin-bottom:22px}
.h-line{width:60%;height:1px;margin:14px 0;background:linear-gradient(90deg,transparent,rgba(78,247,255,.6),transparent)}

/* ============ 卡牌 ============ */
.card{position:relative;width:104px;aspect-ratio:3/4.4;border-radius:12px;padding:7px 7px 9px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center;
  background:linear-gradient(165deg,#13204a,#0b1230 70%);border:1.5px solid rgba(140,180,255,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .1s,box-shadow .12s;color:var(--tx)}
.card:active{transform:scale(.95)}
.card.rarity-common{border-color:rgba(200,240,255,.45)}
.card.rarity-uncommon{border-color:rgba(107,255,142,.55);box-shadow:0 0 14px rgba(107,255,142,.18)}
.card.rarity-rare{border-color:rgba(255,157,78,.65);box-shadow:0 0 18px rgba(255,157,78,.28)}
.card.rarity-basic{border-color:rgba(160,190,255,.35)}
.c-cost{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7fd6ff,#1e5aa8);color:#fff;font-weight:900;font-size:15px;
  display:flex;align-items:center;justify-content:center;border:1.5px solid #c6ecff;box-shadow:0 0 10px rgba(78,247,255,.6)}
.c-icon{font-size:34px;line-height:1;filter:drop-shadow(0 0 6px rgba(78,247,255,.5));margin-top:6px}
.c-name{font-size:13px;font-weight:800;letter-spacing:.5px;line-height:1.2}
.c-desc{font-size:11.5px;color:var(--tx2);line-height:1.45;flex:1;display:flex;align-items:center}
.c-type{font-size:10px;color:var(--cy);letter-spacing:1px;border:1px solid rgba(78,247,255,.4);border-radius:8px;padding:1px 8px}
.c-type.skill{color:var(--gd);border-color:rgba(255,217,78,.4)}
.c-type.power{color:var(--mg);border-color:rgba(255,78,240,.4)}
.c-playable{outline:2px solid rgba(78,247,255,.7);outline-offset:1px}
.c-badge{position:absolute;top:-8px;right:-8px;background:linear-gradient(135deg,#ffd94e,#ff9d4e);color:#241400;
  font-size:9px;font-weight:900;border-radius:8px;padding:2px 6px;box-shadow:0 0 8px rgba(255,217,78,.6)}
.card.upgraded::after{content:"✦";position:absolute;bottom:2px;right:6px;color:var(--gd);font-size:10px}
.card.dim{opacity:.42;pointer-events:none}

/* ============ 戰鬥 UI ============ */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px;
  background:linear-gradient(180deg,rgba(5,9,24,.92),rgba(5,9,24,.35));z-index:6}
/* ============ 全域返回按鈕 ============ */
#btn-back{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top));width:46px;height:46px;border-radius:50%;
  background:rgba(10,18,46,.88);border:1px solid rgba(78,247,255,.5);color:var(--cy);font-size:24px;font-weight:900;
  z-index:60;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.55);
  line-height:1;padding:0;cursor:pointer}
#btn-back:active{transform:scale(.92)}
#tb-left{display:flex;align-items:center;gap:8px;font-size:14px}
.energy-pip{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff2ff,#2090d0);
  border:1px solid #d6f5ff;box-shadow:0 0 8px rgba(78,247,255,.6)}
.energy-pip.used{background:#233;border-color:#345;box-shadow:none}
.tb-num{color:var(--tx2);font-size:13px}
#pile-counts{color:var(--tx2);font-size:13px;display:flex;gap:10px}
#pile-counts b{color:var(--tx)}
#btn-end{font-size:14px;padding:8px 18px;border-color:rgba(107,255,142,.5);color:var(--ok);
  box-shadow:0 0 10px rgba(107,255,142,.2)}
#btn-pause{width:38px;height:38px;border-radius:10px;border:1px solid rgba(140,180,255,.4);
  background:rgba(10,16,40,.8);color:var(--tx);font-size:16px;cursor:pointer}
/* 結束回合 + 自動結束：位於頂欄右側（不擋手牌、不被底部虛擬鍵蓋住） */
#end-turn-box{display:flex;align-items:center;gap:6px}
#end-turn-box #btn-end{font-size:14px;padding:8px 14px;border-radius:12px;
  background:linear-gradient(160deg,#0e4a2a,#0a2a1a);border-color:rgba(107,255,142,.65);color:var(--ok);
  box-shadow:0 0 14px rgba(107,255,142,.35)}
#btn-autoend{font-size:12px;padding:5px 10px;border-radius:10px;border:1px solid rgba(140,180,255,.4);
  background:rgba(10,16,40,.85);color:var(--tx2);cursor:pointer;letter-spacing:1px}
#btn-autoend.on{color:var(--ok);border-color:rgba(107,255,142,.65);box-shadow:0 0 10px rgba(107,255,142,.35)}
#hand{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom, 0px));left:0;right:0;display:flex;justify-content:center;align-items:flex-end;
  gap:5px;padding:6px 4px 10px;z-index:6;pointer-events:none;min-height:120px}
#hand .card{width:min(17vw,86px);pointer-events:auto;animation:cardIn .18s ease-out}
#hand.wrap{flex-wrap:wrap;min-height:220px}
#hand.wrap .card{width:min(19vw,88px)}
@keyframes cardIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#potions{position:absolute;left:10px;bottom:calc(150px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:6px;z-index:6}
#hand.wrap ~ #potions{bottom:calc(248px + env(safe-area-inset-bottom, 0px))}
.pot{width:48px;height:48px;border-radius:12px;background:linear-gradient(160deg,#2a1038,#160a24);
  border:1px solid rgba(255,78,240,.5);display:flex;align-items:center;justify-content:center;font-size:22px;
  cursor:pointer;box-shadow:0 0 10px rgba(255,78,240,.25)}
#turn-banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:7;font-size:26px;font-weight:900;
  letter-spacing:4px;color:var(--cy);text-shadow:0 0 20px rgba(78,247,255,.8);pointer-events:none;opacity:0}
#turn-banner.show{animation:banFade 1s ease forwards}
@keyframes banFade{0%{opacity:0;transform:translateX(-50%) scale(.7)}15%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.15)}}

/* ============ 地圖 ============ */
#screen-map{justify-content:flex-start;padding-top:14px}
#map-title{font-size:21px;font-weight:900;letter-spacing:3px;color:var(--cy);margin-bottom:4px;text-shadow:0 0 14px rgba(78,247,255,.5)}
#map-act{color:var(--tx2);font-size:13px;margin-bottom:10px}
#map-canvas{width:min(96vw,420px);flex:1;max-height:74vh;touch-action:none;border-radius:14px}

/* ============ 獎勵/事件/商店 ============ */
#reward-cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
#reward-cards .card{width:min(22vw,110px)}
#pick-cards .card{width:min(24vw,104px)}
#event-text{margin:14px 0 8px;color:var(--tx);line-height:1.8;font-size:16px;text-align:center}
.event-opt{width:100%;text-align:left;padding:12px 16px;margin:7px 0;border-radius:12px;font-size:15px;
  background:linear-gradient(160deg,#10203f,#0b1430);border:1px solid rgba(140,180,255,.3);color:var(--tx);cursor:pointer;line-height:1.6}
.event-opt:hover{border-color:var(--cy)}
.event-opt .eo-title{font-weight:800;color:var(--cy)}
.event-opt .eo-req{color:var(--bad);font-size:12px}
#shop-grid{display:flex;flex-direction:column;gap:8px;margin:14px 0;width:100%}
.shop-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;
  background:linear-gradient(160deg,#10203f,#0b1430);border:1px solid rgba(140,180,255,.3);cursor:pointer}
.shop-item .si-icon{font-size:26px;width:34px;text-align:center}
.shop-item .si-name{font-weight:800;font-size:15px}
.shop-item .si-desc{color:var(--tx2);font-size:12px}
.shop-item .si-price{color:var(--gd);font-weight:800;font-size:15px;margin-left:auto}
.shop-item.sold{opacity:.35;pointer-events:none}
#gold-bar{font-size:16px;font-weight:800;color:var(--gd);text-shadow:0 0 10px rgba(255,217,78,.5)}

/* ============ 選單列 ============ */
.menu-col{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:10px}
.menu-col .btn{width:100%}

/* ============ 數值列 ============ */
.stat-row{display:flex;justify-content:space-between;width:100%;font-size:14px;padding:6px 0;
  border-bottom:1px solid rgba(140,180,255,.12);color:var(--tx2)}
.stat-row b{color:var(--tx)}
.ach-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;
  background:rgba(16,32,63,.6);border:1px solid rgba(140,180,255,.2);margin:4px 0;font-size:14px}
.ach-item .ai-icon{font-size:20px;width:28px;text-align:center}
.ach-item.locked{opacity:.45}
.row2{display:flex;gap:10px;width:100%}
.row2 .btn{flex:1}

.tiny{color:var(--tx2);font-size:12px;text-align:center;margin-top:10px}
.clickable{cursor:pointer}
.cr-name{font-size:18px;font-weight:900;margin-top:8px}
.cr-tag{font-size:12px;color:var(--cy);margin-top:2px;letter-spacing:1px}
.cr-desc{font-size:13px;color:var(--tx2);margin:8px 0;line-height:1.6;text-align:center}
#title-char-row{display:flex;gap:10px;margin:12px 0}
.char-btn{width:96px;padding:8px;border-radius:12px;background:linear-gradient(160deg,#101f3e,#0a1228);
  border:1px solid rgba(140,180,255,.3);cursor:pointer;color:var(--tx);text-align:center}
.char-btn .cb-icon{font-size:30px}
.char-btn .cb-name{font-size:12px;font-weight:800;margin-top:3px}
.char-btn .cb-lock{font-size:11px;color:var(--bad)}
.char-btn.sel{border-color:var(--cy);box-shadow:0 0 14px rgba(78,247,255,.4)}
#diff-row{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.diff-btn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(140,180,255,.35);
  background:#0d1533;color:var(--tx);font-weight:800;cursor:pointer;font-size:13px}
.diff-btn.sel{border-color:var(--gd);color:var(--gd);box-shadow:0 0 12px rgba(255,217,78,.4)}
.diff-btn.locked{opacity:.3}
#banner-hint{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:12px;color:rgba(150,190,255,.45);z-index:4;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="ui">

  <!-- 戰鬥頂欄 -->
  <div id="topbar" class="hidden">
    <div id="tb-left">
      <div id="energy"></div>
      <div class="tb-num">回合 <b id="turn-num">1</b></div>
      <div id="pile-counts">抽牌<b id="pile-draw">0</b> 棄牌<b id="pile-disc">0</b></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <div id="gold-bar" class="hidden">⛃ <span id="gold-amt">0</span></div>
      <div id="end-turn-box" class="hidden">
        <button id="btn-autoend">⚡自動</button>
        <button id="btn-end" class="btn">結束回合</button>
      </div>
      <button id="btn-pause">⏸</button>
    </div>
  </div>

  <button id="btn-back" class="hidden">←</button>

  <div id="hand" class="hidden"></div>
  <div id="potions" class="hidden"></div>
  <div id="turn-banner"></div>

  <!-- ===== 標題 ===== -->
  <div class="scr show" id="screen-title">
    <div class="title-logo">星穹牌局</div>
    <div class="title-sub">STARFALL CARDS · 星際卡牌 Roguelike</div>
    <div id="title-char-row"></div>
    <div id="diff-row"></div>
    <div class="menu-col">
      <button class="btn big" id="btn-run">▶ 開始遠征</button>
      <button class="btn" id="btn-meta">💎 星塵商店</button>
      <button class="btn" id="btn-ach">🏆 成就</button>
      <button class="btn" id="btn-help">❓ 說明</button>
    </div>
    <div class="tiny" id="title-gems"></div>
  </div>

  <!-- ===== 地圖 ===== -->
  <div class="scr" id="screen-map">
    <div id="map-title">遠征路徑</div>
    <div id="map-act"></div>
    <canvas id="map-canvas"></canvas>
    <div class="tiny">點擊上方可選擇的路徑節點（發亮者）</div>
  </div>

  <!-- ===== 戰鬥獎勵 ===== -->
  <div class="scr" id="screen-reward">
    <div class="panel" style="text-align:center">
      <div class="title-logo" style="font-size:26px">✦ 勝利 ✦</div>
      <div class="h-line"></div>
      <div id="reward-lines"></div>
      <div class="h-line"></div>
      <div id="reward-cards" class="hidden"></div>
      <button class="btn" id="btn-reward-done">繼續</button>
    </div>
  </div>

  <!-- ===== 事件 ===== -->
  <div class="scr" id="screen-event">
    <div class="panel" style="text-align:center">
      <div class="title-logo" style="font-size:22px" id="event-icon">❔</div>
      <div class="cr-name" id="event-title"></div>
      <div id="event-text"></div>
      <div id="event-opts"></div>
    </div>
  </div>

  <!-- ===== 休息 ===== -->
  <div class="scr" id="screen-camp">
    <div class="panel" style="text-align:center">
      <div class="title-logo" style="font-size:24px">🔥 星港補給站</div>
      <div class="cr-desc">選擇一項行動：</div>
      <div id="camp-opts"></div>
    </div>
  </div>

  <!-- ===== 商店 ===== -->
  <div class="scr" id="screen-shop">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="title-logo" style="font-size:22px">🛸 黑市商人</div>
        <div id="gold-bar">⛃ <span id="gold-amt2">0</span></div>
      </div>
      <div id="shop-grid"></div>
      <div class="row2">
        <button class="btn" id="btn-shop-skip">離開</button>
      </div>
    </div>
  </div>

  <!-- ===== 牌組檢視 ===== -->
  <div class="scr" id="screen-deck">
    <div class="panel" style="text-align:center;max-width:480px">
      <div class="title-logo" style="font-size:22px">🂠 牌組 <span id="deck-count" style="font-size:13px"></span></div>
      <div id="deck-grid" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;max-height:60vh;overflow-y:auto"></div>
      <div class="row2">
        <button class="btn" id="btn-deck-close">關閉</button>
      </div>
    </div>
  </div>

  <!-- ===== 結果 ===== -->
  <div class="scr" id="screen-result">
    <div class="panel" style="text-align:center">
      <div id="result-title" class="title-logo" style="font-size:30px"></div>
      <div class="h-line"></div>
      <div id="result-stats"></div>
      <div class="h-line"></div>
      <div id="result-gems" style="font-size:16px;color:var(--gd);font-weight:800"></div>
      <div style="margin-top:14px">
        <button class="btn gold" id="btn-result-next" style="display:none;width:100%">🔥 下一難度</button>
      </div>
      <div class="row2" style="margin-top:10px">
        <button class="btn" id="btn-result-title">回主選單</button>
      </div>
    </div>
  </div>

  <!-- ===== 暫停 ===== -->
  <div class="scr" id="screen-pause">
    <div class="panel" style="text-align:center">
      <div class="title-logo" style="font-size:24px">⏸ 暫停</div>
      <div class="menu-col">
        <button class="btn" id="btn-resume">繼續戰鬥</button>
        <button class="btn" id="btn-deck-open">查看牌組</button>
        <button class="btn" id="btn-map-open">查看地圖</button>
        <button class="btn danger" id="btn-quit-run">放棄本局</button>
      </div>
    </div>
  </div>

  <!-- ===== 星塵商店 ===== -->
  <div class="scr" id="screen-meta">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="title-logo" style="font-size:22px">💎 星塵商店</div>
        <div id="gold-bar">💎 <span id="meta-gems">0</span></div>
      </div>
      <div id="meta-grid" style="margin:12px 0"></div>
      <button class="btn" id="btn-meta-back" style="width:100%">返回</button>
    </div>
  </div>

  <!-- ===== 成就 ===== -->
  <div class="scr" id="screen-ach">
    <div class="panel" style="max-width:440px">
      <div class="title-logo" style="font-size:22px;text-align:center">🏆 成就</div>
      <div id="ach-list" style="margin:12px 0"></div>
      <button class="btn" id="btn-ach-back" style="width:100%">返回</button>
    </div>
  </div>

  <!-- ===== 說明 ===== -->
  <div class="scr" id="screen-help">
    <div class="panel" style="max-width:440px">
      <div class="title-logo" style="font-size:22px;text-align:center">❓ 玩法說明</div>
      <div id="help-text" style="font-size:13px;line-height:1.9;color:var(--tx2);margin:12px 0"></div>
      <button class="btn" id="btn-help-back" style="width:100%">返回</button>
    </div>
  </div>

<script>
/* ===== 星穹牌局 core.js — 迴圈/輸入/粒子/音效/特效 ===== */
'use strict';
const G = {
  W: 720, H: 1280, // 內部邏輯解析度（直屏）
  cv: null, ctx: null, mc: null, mctx: null,
  time: 0, raf: 0, lastT: 0, running: false,
  particles: [], floats: [], shakes: 0, flash: 0,
  screen: 'title', // title|map|combat|...
  viewW: 720, viewH: 1280, scale: 1,
  rng: Math.random,
};

function $(id){ return document.getElementById(id); }

/* ---------- 尺寸（直屏滿屏無黑邊） ---------- */
function resizeCanvas(){
  const cv = G.cv;
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.round((cv.clientWidth || innerWidth) * dpr);
  const ch = Math.round((cv.clientHeight || innerHeight) * dpr);
  cv.width = cw; cv.height = ch;
  G.scale = Math.max(cw / G.W, ch / G.H); // cover-fit
  G.viewW = cw / G.scale; G.viewH = ch / G.scale;
  if (G.mc){ G.mc.width = cw; G.mc.height = ch; }
}
/* 對齊可見視口：網址列/虛擬鍵/鍵盤彈出時即時縮放（Telegram 內建瀏覽器等不吃 dvh 的環境也適用） */
function fitViewport(){
  const vv = window.visualViewport;
  const h = vv && vv.height ? vv.height : innerHeight;
  const vt = vv && typeof vv.offsetTop === 'number' ? Math.max(0, vv.offsetTop) : 0;
  const s = document.documentElement.style;
  s.setProperty('--vh', h + 'px');
  s.setProperty('--vt', vt + 'px');
  resizeCanvas();
}
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', () => setTimeout(fitViewport, 220));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', fitViewport);
  window.visualViewport.addEventListener('scroll', fitViewport);
}
function fit(){ // 每幀設定 canvas 變換
  const s = G.scale;
  G.ctx.setTransform(s, 0, 0, s, (G.cv.width - G.viewW*s)/2, (G.cv.height - G.viewH*s)/2);
}
function toGame(clientX, clientY){
  const r = G.cv.getBoundingClientRect();
  const mx = (clientX - r.left) / r.width * G.viewW;
  const my = (clientY - r.top) / r.height * G.viewH;
  return [mx, my];
}

/* ---------- 主迴圈 ---------- */
function gameLoop(t){
  G.raf = requestAnimationFrame(gameLoop);
  const dt = Math.min(0.05, (t - G.lastT) / 1000 || 0.016);
  G.lastT = t; G.time += dt;
  // 死亡監視狗：任何路徑（含延遲攻擊計時器）使玩家陣亡時，立即收斂到失敗畫面
  if (Combat.C && Combat.C.state === 'lost' && !Combat.C.lostDone){
    Combat.onLose();
  }
  // 勝利監視狗：任何路徑（荊棘反傷/燃燒/侵蝕延遲致死）全滅敵人後，立即收斂到勝利獎勵
  if (Combat.C && Combat.C.state === 'won' && !Combat.C.won){
    Combat.onWin();
  }
  fit();
  const c = G.ctx;
  c.clearRect(0, 0, G.viewW, G.viewH);
  updateFx(dt);
  if (typeof Render !== 'undefined' && Render.draw) Render.draw(c, dt);
  drawFx(c);
}
function startLoop(){ if (G.running) return; G.running = true; G.lastT = performance.now(); G.raf = requestAnimationFrame(gameLoop); }

/* ---------- 特效：粒子/浮字/震屏/閃光 ---------- */
function addParticle(p){ G.particles.push(p); }
function burst(x, y, opts){
  opts = opts || {};
  const n = opts.n || 14, col = opts.col || '#4ef7ff', spd = opts.spd || 220, sz = opts.sz || 4, life = opts.life || .5;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random() * 0.9);
    G.particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, life, t: 0, size: sz*(0.5+Math.random()), col,
      grav: opts.grav || 0, fade: true });
  }
}
function addFloat(x, y, txt, col, sz){
  G.floats.push({ x: x + (Math.random()*30-15), y, txt, col: col || '#fff', t: 0, life: .9, sz: sz || 22 });
}
function shake(amt){ G.shakes = Math.max(G.shakes, amt || 8); }
function flashScreen(a){ G.flash = Math.max(G.flash, a || .35); }
function updateFx(dt){
  G.shakes = Math.max(0, G.shakes - dt * 34);
  G.flash = Math.max(0, G.flash - dt * 1.6);
  const ps = G.particles;
  for (let i = ps.length - 1; i >= 0; i--){
    const p = ps[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.grav || 0) * dt; p.vx *= (1 - dt*1.2); p.vy *= (1 - dt*1.2);
    if (p.t >= p.life) ps.splice(i, 1);
  }
  const fs = G.floats;
  for (let i = fs.length - 1; i >= 0; i--){
    const f = fs[i]; f.t += dt; f.y -= dt * 46;
    if (f.t >= f.life) fs.splice(i, 1);
  }
}
function drawFx(c){
  // 震屏
  if (G.shakes > 0){
    const s = G.shakes;
    c.setTransform(G.scale, 0, 0, G.scale, (G.cv.width - G.viewW*G.scale)/2 + (Math.random()*2-1)*s,
      (G.cv.height - G.viewH*G.scale)/2 + (Math.random()*2-1)*s);
  }
  for (const p of G.particles){
    const a = p.fade ? 1 - p.t/p.life : 1;
    c.globalAlpha = Math.max(0, a);
    c.fillStyle = p.col;
    c.beginPath(); c.arc(p.x, p.y, p.size * (1 - p.t/p.life*0.5), 0, 7); c.fill();
  }
  c.globalAlpha = 1;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const f of G.floats){
    const a = 1 - f.t/f.life;
    c.globalAlpha = a;
    c.font = `900 ${f.sz}px "Segoe UI",sans-serif`;
    c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,10,.8)';
    c.strokeText(f.txt, f.x, f.y);
    c.fillStyle = f.col;
    c.fillText(f.txt, f.x, f.y);
  }
  c.globalAlpha = 1;
  if (G.flash > 0){
    c.fillStyle = `rgba(255,255,255,${G.flash})`;
    c.fillRect(-40, -40, G.viewW + 80, G.viewH + 80);
  }
}

/* ---------- WebAudio 合成音效 ---------- */
const AudioSys = {
  ctx: null, muted: false, _gain: null,
  init(){
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this._gain = this.ctx.createGain(); this._gain.gain.value = 0.28; this._gain.connect(this.ctx.destination);
    } catch(e){}
  },
  resume(){ this.init(); },
  tone(freq, dur, type, vol, slide){
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol || .5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this._gain);
    o.start(t); o.stop(t + dur + .02);
  },
  noise(dur, vol, freq){
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
    const g = this.ctx.createGain(); g.gain.value = vol || .4;
    src.connect(f); f.connect(g); g.connect(this._gain); src.start(t);
  },
  play(name){
    if (this.muted) return;
    switch(name){
      case 'click': this.tone(660, .06, 'square', .3); break;
      case 'card': this.tone(520, .08, 'triangle', .4); this.tone(780, .1, 'triangle', .25, 900); break;
      case 'hit': this.noise(.12, .5, 900); this.tone(180, .1, 'sawtooth', .4, 60); break;
      case 'heavy': this.noise(.3, .7, 500); this.tone(90, .3, 'sawtooth', .6, 40); break;
      case 'block': this.tone(300, .1, 'triangle', .35, 480); break;
      case 'heal': this.tone(440, .15, 'sine', .4, 660); this.tone(660, .2, 'sine', .3, 880); break;
      case 'coin': this.tone(1200, .07, 'square', .25); this.tone(1600, .1, 'square', .2, 1900); break;
      case 'buff': this.tone(240, .18, 'sawtooth', .3, 520); break;
      case 'debuff': this.tone(340, .18, 'square', .3, 120); break;
      case 'power': this.tone(200, .25, 'sawtooth', .4, 700); this.tone(300, .3, 'sine', .3, 900); break;
      case 'burn': this.noise(.25, .4, 2200); break;
      case 'shoot': this.tone(900, .09, 'square', .2, 300); break;
      case 'explode': this.noise(.4, .7, 300); this.tone(60, .4, 'sawtooth', .7, 25); break;
      case 'win': this.tone(523, .18, 'triangle', .4); setTimeout(()=>this.tone(659,.18,'triangle',.4),120); setTimeout(()=>this.tone(784,.3,'triangle',.5),240); break;
      case 'lose': this.tone(330, .3, 'sawtooth', .4, 120); setTimeout(()=>this.tone(220,.5,'sawtooth',.4,80),250); break;
      case 'boss': this.tone(70, .8, 'sawtooth', .7, 40); this.noise(.6, .5, 200); break;
      case 'upgrade': this.tone(600, .1, 'triangle', .4); setTimeout(()=>this.tone(900,.15,'triangle',.4),90); break;
      case 'error': this.tone(160, .15, 'square', .35, 110); break;
    }
  }
};
['touchstart','mousedown','keydown'].forEach(evt => document.addEventListener(evt, () => AudioSys.resume(), { once: false, passive: true }));

/* ---------- 小工具 ---------- */
function rnd(a, b){ return a + Math.random() * (b - a); }
function rndi(a, b){ return Math.floor(rnd(a, b + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function pickW(entries, weightFn){
  let total = 0; const ws = [];
  for (const e of entries){ const w = weightFn(e); ws.push(w); total += w; }
  let r = Math.random() * total;
  for (let i = 0; i < entries.length; i++){ r -= ws[i]; if (r <= 0) return entries[i]; }
  return entries[entries.length - 1];
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(n){ return Math.round(n); }
function showScreen(name){
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('show'));
  const el = $('screen-' + name); if (el) el.classList.add('show');
  G.screen = name;
  // 全域返回按鈕：首頁/戰鬥獎勵（必經步驟）/戰鬥（已有 ⏸ 暫停）不顯示
  const bk = $('btn-back');
  if (bk) bk.classList.toggle('hidden', name === 'title' || name === 'reward' || name === 'combat');
}
function onTap(el, fn){
  // 只綁 click：touch-action:none + viewport 禁用縮放下無 300ms 延遲，且避免 touchend+click 雙觸發
  el.addEventListener('click', fn);
}

/* ---------- 描述產生器（含升級值） ---------- */
function mergeUp(base, up){
  const r = Object.assign({}, base);
  for (const k in up){
    if (up[k] && typeof up[k] === 'object' && !Array.isArray(up[k]) && base[k] && typeof base[k] === 'object'){
      r[k] = Object.assign({}, base[k], up[k]);
    } else r[k] = up[k];
  }
  return r;
}
function cardDesc(v, isUp){
  const tpl = (isUp && v.upDesc) ? v.upDesc : v.desc;
  const m = {
    dmg: v.dmg, block: v.block, draw: v.draw, heal: v.heal, en: v.gainEnergy,
    hits: v.hits, mul: v.mul, selfhp: v.selfHp
  };
  const A = v.applyEnemy || {}, S = v.applySelf || {}, P = v.power || {};
  return tpl.replace(/\{(\w+)(?::(\w+))?\}/g, (all, key, sub) => {
    if (key === 'st') return A[sub] || 0;
    if (key === 'ea') return A[sub] || 0;
    if (key === 'sa') return S[sub] !== undefined ? S[sub] : (P.id === sub ? P.n : 0);
    if (key === 'p') return P[sub] !== undefined ? P[sub] : (P.n !== undefined ? P.n : 0);
    return m[key] !== undefined ? m[key] : all;
  });
}
/* 強化後的實際數值物件（戰鬥邏輯用；isUp = 該卡是否已升級） */
function cardVals(c, isUp){ return isUp ? mergeUp(c, c.up) : c; }

/* ===== 星穹牌局 g1_combat.js — 戰鬥引擎 ===== */
'use strict';
const Combat = {
  C: null,
  start(nodeType, enemies, opts){
    opts = opts || {};
    const run = Run;
    const C = this.C = {
      nodeType, enemies: [], player: null, state: 'player',
      turn: 1, extraTurn: false, noDamage: true, won: false,
      opts
    };
    // 玩家
    C.player = {
      hp: run.hp, maxHp: run.maxHp, block: 0, energy: 0, maxEnergy: run.energyCap,
      buffs: {}, powers: {},
      deck: shuffle(run.deck.map(c => Object.assign({}, c))),
      draw: [], hand: [], disc: [], exhaust: [],
      firstAttackDone: false
    };
    const P = C.player;
    // 敵人（複製數據 + 倍率）
    for (const { def, m } of enemies){
      const hp = Math.round(def.hp * (m || 1));
      C.enemies.push({
        def, hp, maxHp: hp, block: 0, buffs: {}, idx: 0, phase2: false,
        flashT: 0, lunge: 0, dead: false, slot: C.enemies.length
      });
    }
    // 起始遺物效果
    if (run.hasRelic('ember_charm')) C.enemies.forEach(e => this.addStatus(e, { burn: 2 }));
    if (run.hasRelic('venom_ring')) C.enemies.forEach(e => this.addStatus(e, { pois: 2 }));
    if (run.hasRelic('thorn_armor')) P.buffs.thorns = (P.buffs.thorns || 0) + 2;
    if (run.hasRelic('tac_visor')) P.buffs.str = (P.buffs.str || 0) + 1;
    if (run.hasRelic('energy_soup')) this.healPlayer(5);
    if (run.hasRelic('black_hole')){} // 回合結束時處理
    // 第一回合開始
    this.playerTurnStart();
    AudioSys.play('boss');
    UI.enterCombat();
  },
  /* ---------- 回合流程 ---------- */
  playerTurnStart(){
    const C = this.C, P = C.player;
    // 安全網：若敵方已全滅卻未進入勝利（如燃燒/侵蝕致死漏判），立即收斂
    this.checkEnemiesDead();
    if (C.state === 'won'){ this.onWin(); return; }
    if (C.turn > 1){
      if (C.extraTurn) { C.extraTurn = false; UI.banner('⏳ 額外回合'); }
    }
    // 護甲不隨回合重置：沒被打穿前持續疊加直到戰鬥結束
    P.energy = P.maxEnergy;
    // 每回合開始賦能
    if (Run.hasRelic('stardust_core')) P.energy += 1;
    if (C.turn === 1){
      if (Run.hasRelic('battery_pack')) P.energy += 2;
      if (Run.hasRelic('power_core')) P.energy += 1;
      if (Run.hasRelic('ammo_belt')) this.draw(3);
    }
    if (Run.hasRelic('flex_shield')) P.block += 2;
    // 能力
    const pw = P.powers;
    if (pw.energyStart) { P.energy += pw.energyStart; if (pw.energyDraw) this.draw(pw.energyDraw); }
    if (pw.blockStart) P.block += pw.blockStart;
    if (pw.burnAura) C.enemies.forEach(e => this.addStatus(e, { burn: pw.burnAura }));
    // 每回合開始的傷害（如燃燒對玩家 -- 玩家身上無 burn，略）
    P.firstAttackDone = false;
    let drawN = 5 + (pw.drawBonus || 0);
    if (Run.hasRelic('humming_pendant')) drawN += 1;
    this.draw(drawN);
    C.state = 'player';
    UI.refreshCombat();
    UI.sortHand();
    this.maybeAutoEnd();
  },
  draw(n){
    const P = this.C.player;
    for (let i = 0; i < n; i++){
      if (P.hand.length >= 10) break;
      if (!P.draw.length){
        if (P.deck.length){ P.draw = shuffle(P.deck); P.deck = []; }
        else if (P.disc.length){ P.draw = shuffle(P.disc); P.disc = []; }
        else break;
      }
      P.hand.push(P.draw.pop());
    }
  },
  /* ---------- 打牌 ---------- */
  playCard(i){
    const C = this.C;
    if (C.state !== 'player' || !C.enemies.length) return false;
    const P = C.player;
    const card = P.hand[i];
    if (!card) return false;
    const data = CARDS[card.id];
    if (!data) return false;
    const v = cardVals(data, card.up);
    if (P.energy < v.cost){ AudioSys.play('error'); UI.toast('能量不足！'); return false; }
    if (data.target === 'enemy' && !C.enemies.some(e => !e.dead)) return false;
    P.energy -= v.cost;
    P.hand.splice(i, 1);
    // 執行效果
    this.resolveCard(data, v, card);
    // 費用 0 抽牌（虛空碎片）
    if (v.cost === 0 && Run.hasRelic('void_shard')) this.draw(1);
    // 進棄牌/消耗
    if (data.exhaust) P.exhaust.push(card); else P.disc.push(card);
    Run.cardsPlayed++;
    Save.stats.cardsPlayed++;
    if (Save.stats.cardsPlayed >= 500) Save.unlock('cards_500');
    // 檢查結束
    this.checkEnemiesDead();
    if (C.state === 'won'){ this.onWin(); return true; }
    if (C.state === 'lost'){ this.onLose(); return true; }
    UI.refreshCombat();
    this.maybeAutoEnd();
    return true;
  },
  resolveCard(data, v, card){
    const C = this.C, P = C.player;
    const isAttack = data.type === 'attack';
    // 目標
    let targets = [];
    if (data.target === 'all') targets = C.enemies.filter(e => !e.dead);
    else if (data.target === 'enemy') targets = [this.frontEnemy()];
    const tgt = targets[0];
    // 攻擊（爆發卡無 dmg 欄位，跳過通用迴圈）
    if (isAttack){
      const firstAttackThisTurn = !P.firstAttackDone;
      if (v.dmg !== undefined){
        for (let h = 0; h < (v.hits || 1); h++){
          for (const e of targets){
            if (e.dead) continue;
            this.hitEnemy(e, v.dmg, data, v, h);
          }
        }
      }
      if (firstAttackThisTurn && tgt){
        P.firstAttackDone = true;
        if (Run.hasRelic('siphon_chip')) this.draw(1);
        if (Run.hasRelic('prism')){
          const b = Math.random() < 0.5 ? 'str' : 'dex';
          P.buffs[b] = (P.buffs[b] || 0) + 1;
          AudioSys.play('buff');
          FX.statusUp(360, 750, b === 'str' ? '力量+1' : '敏捷+1', '#6bff8e');
        }
      }
    }
    // 燃燒/侵蝕爆發（獨立於 isAttack：劇毒爆發是 skill 型）
    if (data.special === 'burnburst' || data.special === 'poisburst'){
      const e = this.frontEnemy();
      if (e){
        const key = data.special === 'burnburst' ? 'burn' : 'pois';
        const st = e.buffs[key] || 0;
        if (st > 0){ this.hitEnemy(e, st * v.mul, data, v, 0); e.buffs[key] = 0; }
      }
    }
    // 狀態施加
    if (v.applyEnemy) targets.forEach(e => this.addStatus(e, v.applyEnemy));
    if (v.applySelf) this.addStatus(P, v.applySelf);
    // 護甲/治療/抽牌/能量
    if (v.block) P.block += v.block;
    if (v.heal) this.healPlayer(v.heal);
    if (v.draw) this.draw(v.draw);
    if (v.gainEnergy) P.energy += v.gainEnergy;
    if (v.selfHp){ this.damagePlayer(v.selfHp, true); }
    // 能力（用 v.power：升級後的能力值才生效）
    if (v.power) this.applyPower(v.power);
    // 特殊
    if (data.special === 'extraTurn') C.extraTurn = true;
    if (data.special === 'purify'){ delete P.buffs.weak; delete P.buffs.vuln; FX.statusUp(360, 750, '淨化', '#4ef7ff'); }
    // 特效聲音
    if (isAttack){ AudioSys.play('hit'); shake(4); } else if (data.type === 'power'){ AudioSys.play('power'); }
    else { AudioSys.play('card'); }
  },
  applyPower(p){
    const P = this.C.player;
    const pw = P.powers;
    switch (p.id){
      case 'str': P.buffs.str = (P.buffs.str || 0) + p.n; FX.statusUp(360, 750, '力量+' + p.n, '#ff9d4e'); break;
      case 'burnAura': pw.burnAura = (pw.burnAura || 0) + p.n; break;
      case 'burnEnd': pw.burnEnd = (pw.burnEnd || 0) + p.n; break;
      case 'drawBonus': pw.drawBonus = (pw.drawBonus || 0) + p.n; break;
      case 'blockEnd': pw.blockEnd = (pw.blockEnd || 0) + p.n; break;
      case 'blockStart': pw.blockStart = (pw.blockStart || 0) + p.n; break;
      case 'energyStart': pw.energyStart = (pw.energyStart || 0) + p.n; pw.energyDraw = p.draw || 0; break;
    }
    AudioSys.play('power');
    FX.powerRing(360, 830, '#4ef7ff');
    shake(3);
  },
  epos(e){ return Render.epos(e.slot, this.C.enemies.length); },
  hitEnemy(e, baseDmg, data, v, hitIdx){
    const P = this.C.player;
    let dmg = baseDmg + (P.buffs.str || 0);
    if (P.buffs.weak) dmg = Math.round(dmg * 0.75);
    if (e.buffs.vuln) dmg = Math.round(dmg * 1.5);
    dmg = Math.max(0, dmg);
    this.dealToEnemy(e, dmg);
    if (dmg >= 50) Save.unlock('big_hit');
    const p = this.epos(e);
    FX.slash(p.x, p.y - 16, Math.random() * 6.28, e.def.col, dmg);
    e.flashT = 0.16;
  },
  /* ---------- 傷害/狀態 ---------- */
  frontEnemy(){
    return this.C.enemies.find(e => !e.dead) || null;
  },
  dealToEnemy(e, dmg){
    const p = this.epos(e);
    if (e.block >= dmg){ e.block -= dmg; FX.blockHit(p.x, p.y - 40); }
    else {
      dmg -= e.block; e.block = 0;
      e.hp -= dmg;
      addFloat(p.x, p.y - 24, String(dmg), '#ffd94e', 20);
      if (e.hp <= 0){
        e.hp = 0; e.dead = true;
        const t = e.def.tier === 'boss' ? 'boss' : e.def.tier === 'elite' ? 'elite' : 'normal';
        FX.explode(p.x, p.y - 16, e.def.col);
        AudioSys.play('explode'); shake(6);
        Run.kills++; Save.stats.kills++;
        if (Save.stats.kills >= 100) Save.unlock('kills_100');
        Run.gemsCollected += t === 'normal' ? 2 : 5;
        if (Run.hasRelic('greed_fang') && Math.random() < 0.15){ Run.gold += 6; addFloat(p.x, p.y - 70, '+6⛃', '#ffd94e', 16); }
        if (Run.hasRelic('reaper_scythe')) this.healPlayer(2);
        Combat.C.opts.killedBoss = Combat.C.opts.killedBoss || (e.def.tier === 'boss');
      }
    }
  },
  addStatus(target, st){
    for (const k in st){
      target.buffs[k] = (target.buffs[k] || 0) + st[k];
    }
    if (st.burn && target.def && st.burn >= 20) Save.unlock('burn_20');
  },
  healPlayer(n){
    if (!this.C) return;
    const P = this.C.player;
    if (P.hp <= 0) return;
    P.hp = Math.min(P.maxHp, P.hp + n);
    AudioSys.play('heal');
    addFloat(360, 830, '+' + n, '#6bff8e', 18);
  },
  damagePlayer(n, ignoreBlock){
    if (!this.C) return;
    const P = this.C.player, C = this.C;
    let d = n;
    if (!ignoreBlock && P.block > 0){
      if (P.block >= d){ P.block -= d; d = 0; } else { d -= P.block; P.block = 0; }
    }
    if (d > 0){
      P.hp -= d;
      C.noDamage = false;
      addFloat(360, 810, '-' + d, '#ff5a6e', 22);
      shake(7);
      AudioSys.play('hit');
      if (P.hp <= 0){ P.hp = 0; C.state = 'lost'; }
    }
  },
  /* ---------- 敵人回合 ---------- */
  endTurn(){
    const C = this.C;
    if (C.state !== 'player') return;
    // 結束玩家回合：棄光手牌
    const P = C.player;
    P.disc = P.disc.concat(P.hand); P.hand = [];
    // 玩家回合結束狀態結算
    this.endOfTurnPlayer(P);
    if (C.state === 'lost'){ this.onLose(); return; }
    C.state = 'enemy';
    UI.refreshCombat();
    if (C.extraTurn){
      C.turn++;
      this.playerTurnStart();
      return;
    }
    // 敵人行動
    for (const e of C.enemies){
      if (e.dead) continue;
      this.enemyAct(e);
    }
    C.enemies = C.enemies.filter(e => !e.dead);
    if (C.state === 'lost'){ this.onLose(); return; }
    // 敵人回合結束：燃燒/侵蝕/狀態
    for (const e of C.enemies){
      this.endOfTurnEnemy(e);
    }
    // 檢查全滅
    this.checkEnemiesDead();
    if (C.state === 'won'){ this.onWin(); return; }
    C.turn++;
    this.playerTurnStart();
  },
  enemyAct(e){
    const C = this.C, P = C.player;
    const pat = (e.phase2 && e.def.pat2) ? e.def.pat2 : e.def.pat;
    const it = pat[e.idx % pat.length];
    e.idx++;
    const dmgMul = 1 + (Run.diff || 0) * 0.08;
    const act = (() => {
      if (it.i === 'atk'){
        let d = Math.round((it.d + (e.buffs.str || 0)) * dmgMul);
        if (e.buffs.weak) d = Math.round(d * 0.75);
        if (P.buffs.vuln) d = Math.round(d * 1.5);
        const hits = it.h || 1;
        e.lunge = 0.25;
        const p = this.epos(e);
        const cid = this.C; // 綁定本場戰鬥：結束後殘留攻擊一律作廢（防燒死後幽靈攻擊卡死）
        for (let h = 0; h < hits; h++){
          setTimeout(() => {
            if (this.C !== cid || cid.state === 'won' || cid.state === 'lost') return;

  intentWarn(x, y, d, col){ this.anims.push({ type:'warn', x, y, d, col, t: 0 }); },
  update(dt){

        c.restore();
      } else if (a.type === 'dash'){
        c.globalAlpha = 1 - p;
        c.strokeStyle = a.col; c.lineWidth = 9 * (1 - p) + 2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(a.x1, a.y1); c.lineTo(a.x2, a.y2); c.stroke();
        c.strokeStyle = '#fff'; c.lineWidth = 3 * (1 - p);
        c.beginPath(); c.moveTo(a.x1, a.y1); c.lineTo(a.x2, a.y2); c.stroke();
        c.globalAlpha = 1;

        c.globalAlpha = 1 - p;
        c.strokeStyle = '#7dff9e'; c.lineWidth = 3;
        c.beginPath(); c.arc(a.x, a.y, 26 + p * 18, 0, 7); c.stroke();
        c.globalAlpha = 1;
      } else if (a.type === 'ring'){
        c.globalAlpha = 1 - p;
        c.strokeStyle = a.col; c.lineWidth = 4;

        c.fillStyle = a.col;

        c.globalAlpha = 1;

        c.fillStyle = a.col;
        c.save(); c.translate(a.x, a.y);

    }

};
/* ===== 星穹牌局 g2_map.js — 路徑地圖生成 ===== */
'use strict';
const MapGen = {
  FLOORS: 8, SLOTS: 3,
  generate(act){
    const floors = [];
    const bossFloor = this.FLOORS + 1; // 第 9 層 = Boss
    // 起點
    const start = { id: 0, f: 0, s: 1, type: 'start', next: [] };
    const nodes = [start];
    let idc = 1;
    const grid = [];
    for (let f = 1; f <= this.FLOORS; f++){
      const row = [];
      for (let s = 0; s < this.SLOTS; s++){
        const type = this.rollType(f, act);
        const n = { id: idc++, f, s, type, next: [], prev: [] };
        nodes.push(n); row.push(n);
      }
      grid.push(row);
    }
    const boss = { id: idc++, f: bossFloor, s: 1, type: 'boss', next: [], prev: [] };
    nodes.push(boss);
    // 連線：每層相鄰 slot 差 <=1
    const last = grid[grid.length - 1];
    for (const n of last) boss.prev.push(n); // 最後一層都能通 Boss
    boss.prev.forEach(p => p.next.push(boss));
    let prev = [start];
    for (const row of grid){
      for (const p of prev){
        const targets = row.filter(n => Math.abs(n.s - p.s) <= 1);
        for (const t of targets){ p.next.push(t); t.prev.push(p); }
      }
      prev = row;
    }
    // 確保每個節點至少一條出路
    for (const n of nodes) if (!n.next.length){
      const rowAbove = grid.find(r => r.some(x => x.f === n.f + 1)) || [boss];
      const t = rowAbove.find(x => Math.abs(x.s - n.s) <= 1) || rowAbove[0];
      n.next.push(t); t.prev.push(n);
    }
    return { nodes, boss, act };
  },
  rollType(f, act){
    const w = {
      combat: 46, elite: f >= 4 ? 14 : 10, event: 20, camp: 16, shop: 12
    };
    let total = 0; for (const k in w) total += w[k];
    let r = Math.random() * total;
    for (const k in w){ r -= w[k]; if (r <= 0) return k; }
    return 'combat';
  },
  /* 遭遇敵人 */
  makeEncounter(tier, act, diff){
    const pool = ACT_POOLS[act];
    const m = 1 + diff * 0.14; // 敵人生命倍率
    if (tier === 'boss') return [{ def: ENEMIES[pool.boss], m }];
    if (tier === 'elite'){
      const e = ENEMIES[pick(pool.elite)];
      return [{ def: e, m }];
    }
    const n = Math.random() < 0.45 ? 2 : 1;
    const es = [];
    for (let i = 0; i < n; i++) es.push({ def: ENEMIES[pick(pool.normal)], m });
    return es;
  }
};

/* 地圖渲染：獨立 canvas */
const MapView = {
  NODE_R: 30,
  draw(){
    const cv = $('map-canvas'), c = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
    if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    const M = Run.map;
    if (!M) return;
    const mapW = W, mapH = H - 10 * dpr;
    const px = s => mapW / 2 + (s - 1) * (mapW / 3.4);
    const py = f => 24 * dpr + (f / (MapGen.FLOORS + 1)) * (mapH - 48 * dpr);
    const iconOf = t => ({ combat:'⚔️', elite:'💀', event:'❔', camp:'🔥', shop:'🛒', boss:'👑', start:'🚀' }[t] || '·');
    c.save();
    // 連線
    c.strokeStyle = 'rgba(120,150,220,.25)'; c.lineWidth = 2 * dpr;
    for (const n of M.nodes){
      if (n.type === 'start') continue;
      for (const nx of n.next){
        c.beginPath(); c.moveTo(px(n.s), py(n.f)); c.lineTo(px(nx.s), py(nx.f)); c.stroke();
      }
    }
    // 節點
    for (const n of M.nodes){
      const x = px(n.s), y = py(n.f);
      const isCur = Run.node && Run.node.id === n.id;
      const avail = Run.node && Run.node.next && Run.node.next.some(t => t.id === n.id);
      const visited = Run.visited && Run.visited[n.id];
      let col = 'rgba(70,90,160,.55)';
      let r = this.NODE_R * dpr * 0.9;
      if (isCur) col = '#4ef7ff';
      else if (avail) col = '#ffd94e';
      else if (visited) col = 'rgba(70,90,160,.35)';
      // 光暈
      if (isCur || avail){
        c.shadowColor = isCur ? '#4ef7ff' : '#ffd94e';
        c.shadowBlur = 22 * dpr;
      }
      c.fillStyle = col;
      c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.5 * dpr;
      c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke();
      c.font = `${Math.round(22 * dpr)}px sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(iconOf(n.type), x, y + 1 * dpr);
    }
    c.restore();
  },
  hitTest(e){
    const r = $('map-canvas').getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const M = Run.map;
    if (!M || !Run.node) return null;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const mapW = r.width, mapH = r.height - 10 * dpr;
    const px = s => mapW / 2 + (s - 1) * (mapW / 3.4);
    const py = f => 24 * dpr + (f / (MapGen.FLOORS + 1)) * (mapH - 48 * dpr);
    // 觸控熱區加大（手指友善）
    const hitR = Math.max(30, this.NODE_R * 0.9 + 18);
    for (const n of M.nodes){
      if (!Run.node.next || !Run.node.next.some(t => t.id === n.id)) continue;
      const x = px(n.s), y = py(n.f);
      if (Math.hypot(mx - x, my - y) <= hitR) return n;
    }
    return null;
  }
};

  },
  loseRelic(){
    if (this.relics.length <= 1){ this.hp -= 8; UI.toast('沒有遺物可交，失去 8 生命'); return null; }
    const pool = this.relics.slice(1); // 保留起始遺物
    const id = pick(pool);
    this.relics = this.relics.filter(x => x !== id);
    UI.toast('失去遺物：' + RELICS[id].name);
    return id;
  },
  upgradeOneCard(cardObj){ cardObj.up = true; },
  deckUpgraded(){ return this.deck.filter(c => c.up).length; },

  /* ---------- 事件效果 ---------- */
  resolveEvent(opt){
    const eff = opt.eff;
    const next = () => { UI.showMap(); };
    switch (eff.type){
      case 'nothing': next(); break;
      case 'heal':
        if (eff.v > 0){ this.hp = Math.min(this.maxHp, this.hp + eff.v); UI.toast('回復 ' + eff.v + ' 生命'); }
        else { this.hp += eff.v; UI.toast('失去 ' + (-eff.v) + ' 生命'); if (this.hp <= 0) return this.endRun(false); }
        if (eff.gold) this.gainGold(eff.gold);
        if (eff.relicChance && Math.random() < eff.relicChance) this.randomRelic();
        next(); break;
      case 'healPct':
        const h = Math.round(this.maxHp * eff.v / 100);
        this.hp = Math.min(this.maxHp, this.hp + h);
        UI.toast('回復 ' + h + ' 生命');
        next(); break;
      case 'gold': this.gainGold(eff.v); next(); break;
      case 'card':
        UI.pickCardReward(eff.rng, 1, () => { this.resolveEvent({ eff: { type: 'nothing' } }); });
        break;
      case 'relic':
        if (eff.pay){ this.gold -= eff.pay; }
        this.randomRelic();
        next(); break;
      case 'potion':
        if (eff.pay) this.gold -= eff.pay;
        const p = this.gainPotion();
        if (!p && eff.card) UI.pickCardReward('common', 1, next);
        else if (eff.card){ UI.pickCardReward('common', 1, next); }
        else next();
        break;
      case 'removeCard': UI.pickDeck('remove', null, next); break;
      case 'upgradeCard': UI.pickDeck('upgrade', null, next); break;
      case 'fight': {
        const tier = eff.tier;
        const enemies = eff.n === 2
          ? [{ def: ENEMIES[pick(ACT_POOLS[this.act].normal)], m: 1 + this.diff * 0.14 }, { def: ENEMIES[pick(ACT_POOLS[this.act].normal)], m: 1 + this.diff * 0.14 }]
          : MapGen.makeEncounter(tier, this.act, this.diff);
        Combat.start(eff.tier, enemies, { eventLoot: eff.loot });
        break;
      }
      case 'gamble':
        if (Math.random() < 0.5){
          if (eff.win.relic) this.randomRelic();
          else if (eff.win.heal) { this.hp = Math.min(this.maxHp, this.hp + eff.win.heal); UI.toast('命運眷顧：回復 ' + eff.win.heal + ' 生命'); }
        } else {
          if (eff.lose.loseHp){ this.hp -= eff.lose.loseHp; UI.toast('付出代價：失去 ' + eff.lose.loseHp + ' 生命'); if (this.hp <= 0) return this.endRun(false); }
        }
        next(); break;
      case 'loseRelic': this.loseRelic(); next(); break;
    }
  },

  /* ---------- 商店 ---------- */
  shopStock: null,
  makeShop(){
    const pool = this.freeRelicId().filter(id => RELICS[id].rarity !== 'rare');
    const relics = shuffle(pool).slice(0, 2);
    const cards = [];
    for (let i = 0; i < 4; i++){
      const r = pickW(['common', 'uncommon', 'rare'], r => r === 'common' ? 5 : r === 'uncommon' ? 3 : 1);
      cards.push(this.randomCard(r));
    }
    this.shopStock = {
      cards, relics, potion: pick(['heal', 'energy', 'aoe']),
      removePrice: 75
    };
  },
  shopPrice(base){ return Math.round(base * (this.hasRelic('beginner_rune') ? 0.85 : 1)); },
  buyCard(idx){
    const it = this.shopStock.cards[idx];
    if (it === null) return;
    const price = this.shopPrice({ common: 45, uncommon: 70, rare: 115 }[CARDS[it].rarity]);
    if (this.gold < price){ UI.toast('金幣不足！'); return; }
    this.gold -= price;
    this.addCard(it);
    this.shopStock.cards[idx] = null;
    UI.renderShop();
  },
  buyRelic(i){
    const it = this.shopStock.relics[i];
    if (it === null) return;
    if (this.relics.indexOf(it) !== -1) return;
    const price = this.shopPrice(145);
    if (this.gold < price){ UI.toast('金幣不足！'); return; }
    this.gold -= price;
    this.gainRelic(it);
    this.shopStock.relics[i] = null;
    UI.renderShop();
  },
  buyPotion(){
    const price = this.shopPrice(45);
    if (this.gold < price){ UI.toast('金幣不足！'); return; }
    this.gold -= price;
    this.gainPotion();
    UI.renderShop();
  },
  buyRemove(){
    if (this.deck.length <= 5){ UI.toast('牌組太少，不能刪牌'); return; }
    if (this.gold < this.shopStock.removePrice){ UI.toast('金幣不足！'); return; }
    this.gold -= this.shopStock.removePrice;
    UI.pickBack = () => UI.showShop();
    UI.pickDeck('remove', null, () => UI.showShop());
  },

  /* ---------- 休息點 ---------- */
  doCamp(opt){
    if (opt === 'heal'){
      const h = Math.round(this.maxHp * 0.3);
      this.hp = Math.min(this.maxHp, this.hp + h);
      UI.toast('回復 ' + h + ' 生命');
      UI.showMap();
    } else if (opt === 'upgrade'){
      UI.pickDeck('upgrade', null, () => UI.showMap());
    } else if (opt === 'remove'){
      UI.pickDeck('remove', null, () => UI.showMap());
    }
  },

  /* ---------- 結束 ---------- */
  endRun(win){
    this.started = false;
    let gems = this.gemsCollected;
    if (win){
      gems += 60 + this.act * 20;
      Save.stats.wins++;
      Save.unlock('first_win');
      if (this.diff >= 3) Save.unlock('win_diff3');
      Save.stats.winChars = Save.stats.winChars || {};
      Save.stats.winChars[this.char] = 1;
      if (Save.stats.winChars.xia && Save.stats.winChars.yan && Save.stats.winChars.ling) Save.unlock('win_all');
    } else {
      gems = Math.max(5, Math.round(gems * 0.5));
    }
    const mult = 1 + Save.metaLv('starMult') * 0.2;
    const finalGems = Math.round(gems * mult);
    Save.addGems(finalGems);
    Save.stats.runs++;
    Save.stats.totalGems += finalGems;
    Save.stats.bestAct = Math.max(Save.stats.bestAct, this.act);
    Save.stats.maxKills = Math.max(Save.stats.maxKills, this.kills);
    Save.save();
    UI.showResultWin(win, finalGems);
  }
};
/* ===== 星穹牌局 g4_save.js — 存檔/成就 ===== */
'use strict';
const Save = {
  KEY: 'starcards_save_v1',
  gems: 0,
  meta: {},
  stats: { runs: 0, wins: 0, kills: 0, cardsPlayed: 0, bestAct: 0, maxKills: 0, totalGems: 0, winChars: {} },
  ach: {},
  load(){
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY) || '{}');
      if (d.v !== 1) throw 0;
      this.gems = d.gems || 0;
      this.meta = d.meta || {};
      this.stats = Object.assign(this.stats, d.stats || {});
      this.ach = d.ach || {};
    } catch(e){
      this.gems = 0; this.meta = {}; this.ach = {};
    }
  },
  save(){
    try {
      localStorage.setItem(this.KEY, JSON.stringify({ v: 1, gems: this.gems, meta: this.meta,
        stats: this.stats, ach: this.ach }));
    } catch(e){}
  },
  addGems(n){ this.gems += n; this.save(); },
  spendGems(n){
    if (this.gems < n) return false;
    this.gems -= n; this.save(); return true;
  },
  metaLv(id){ return this.meta[id] || 0; },
  buyMeta(id){
    const m = META_UPGRADES.find(x => x.id === id);
    const lv = this.metaLv(id);
    if (lv >= m.max) return false;
    const cost = m.costs[lv];
    if (!this.spendGems(cost)) return false;
    this.meta[id] = lv + 1;
    this.save();
    return true;
  },
  diffUnlocked(n){ return n === 0 || this.metaLv('diff') >= n; },
  unlock(id){
    if (this.ach[id]) return;
    const a = ACHIEVEMENTS.find(x => x.id === id);
    if (!a) return;
    this.ach[id] = 1;
    this.save();
    UI.toast('🏆 成就解鎖：' + a.name);
    AudioSys.play('win');
  }
};

/* ===== 星穹牌局 r1_render.js — Canvas 渲染 ===== */
'use strict';
const Render = {
  stars: [], neb: [],
  init(){
    for (let i = 0; i < 90; i++) this.stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .4, sp: .02 + Math.random() * .05, ph: Math.random() * 7 });
    for (let i = 0; i < 3; i++) this.neb.push({ x: Math.random(), y: .3 + Math.random() * .4, r: 120 + Math.random() * 160, col: ['#7a3dff', '#00c8a0', '#ff4ef0'][i] });
  },
  /* 敵人位置（依數量分配） */
  epos(slot, n){
    let x = 360, y = 300;
    if (n === 2) x = slot === 0 ? 260 : 460;
    if (n === 3) x = 155 + slot * 205;
    return { x, y };
  },
  W: 720, H: 1280,
  draw(c, dt){
    const act = Run.started ? (ACTS[Run.act] || ACTS[1]) : ACTS[1];
    this.drawBG(c, act, dt);
    if (Combat.C && G.screen === 'combat' || (Combat.C && G.screen === 'reward' && Combat.C.state === 'won')) this.drawCombat(c, dt);
    FX.update(dt);
    FX.draw(c);
    // 玩家受擊暗紅邊
    if (Combat.C && Combat.C.player && Combat.C.player.hp <= Combat.C.player.maxHp * 0.3){
      c.globalAlpha = .12 + Math.sin(G.time * 5) * .05;
      c.fillStyle = '#ff2020';
      c.fillRect(0, 0, this.W, this.H);
      c.globalAlpha = 1;
    }
  },
  drawBG(c, act, dt){
    const g = c.createLinearGradient(0, 0, 0, this.H);
    g.addColorStop(0, act.bg[0]); g.addColorStop(1, act.bg[1]);
    c.fillStyle = g; c.fillRect(0, 0, this.W, this.H);
    // 星雲
    for (const n of this.neb){
      const rx = n.x * this.W + Math.sin(G.time * .08 + n.r) * 20;
      const ry = n.y * this.H + Math.cos(G.time * .06) * 30;
      const rg = c.createRadialGradient(rx, ry, 0, rx, ry, n.r);
      rg.addColorStop(0, n.col + '33'); rg.addColorStop(1, 'transparent');
      c.fillStyle = rg; c.fillRect(rx - n.r, ry - n.r, n.r * 2, n.r * 2);
    }
    // 星
    for (const s of this.stars){
      const y = (s.y * this.H + G.time * 14 * s.sp) % this.H;
      const tw = .5 + .5 * Math.sin(G.time * 2 + s.ph);
      c.globalAlpha = tw * .8;
      c.fillStyle = s.s > 1.4 ? '#cfe8ff' : '#8fb8e8';
      c.fillRect(s.x * this.W, y, s.s, s.s * 2.2);
    }
    c.globalAlpha = 1;
  },
  drawCombat(c, dt){
    const C = Combat.C, P = C.player;
    // 敵方
    C.enemies.forEach((e, i) => {
      const p = this.epos(e.slot, C.enemies.length);
      this.drawEnemy(c, e, p, dt);
    });
    // 玩家
    this.drawPlayer(c, P, dt);
  },
  drawEnemy(c, e, p, dt){
    if (e.dead) return;
    const r = e.def.tier === 'boss' ? 66 : e.def.tier === 'elite' ? 48 : 40;
    const bob = Math.sin(G.time * 3 + e.slot * 2) * 5;
    const lunge = e.lunge > 0 ? Math.sin((.25 - e.lunge) / .25 * Math.PI) * 26 : 0;
    const x = p.x, y = p.y + bob + lunge;
    const col = e.def.col;
    // 光暈
    const gr = c.createRadialGradient(x, y, r * .3, x, y, r * 1.7);
    gr.addColorStop(0, col + '55'); gr.addColorStop(1, 'transparent');
    c.fillStyle = gr;
    c.beginPath(); c.arc(x, y, r * 1.7, 0, 7); c.fill();
    // 本體
    c.save();
    c.translate(x, y);
    if (e.flashT > 0){ c.globalAlpha = Math.min(1, e.flashT * 6); }
    c.fillStyle = col;
    c.shadowColor = col; c.shadowBlur = 16;
    c.beginPath();
    if (e.def.tier === 'boss'){
      // 核心 + 旋轉環
      c.arc(0, 0, r, 0, 7); c.fill();
      c.rotate(G.time * 1.2);
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.globalAlpha = .8;
      for (let i = 0; i < 3; i++){
        c.rotate(2.094);
        c.beginPath(); c.arc(0, 0, r * 1.25, 0, 1.4); c.stroke();
      }
    } else if (e.def.tier === 'elite'){
      // 六邊形
      for (let i = 0; i < 6; i++){
        const a = i / 6 * 6.283 + .3;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.closePath(); c.fill();
    } else {
      // 圓形 + 尖角（船型）
      c.arc(0, 0, r * .85, 0, 7); c.fill();
      c.beginPath(); c.moveTo(0, -r * 1.35); c.lineTo(r * .55, -r * .2); c.lineTo(-r * .55, -r * .2); c.closePath(); c.fill();
    }
    c.shadowBlur = 0;
    // 眼睛
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-r * .3, -r * .15, r * .13, 0, 7); c.arc(r * .3, -r * .15, r * .13, 0, 7); c.fill();
    c.fillStyle = '#101426';
    c.beginPath(); c.arc(-r * .3, -r * .1, r * .06, 0, 7); c.arc(r * .3, -r * .1, r * .06, 0, 7); c.fill();
    c.restore();
    // 燃燒火焰
    if (e.buffs.burn){ c.fillStyle = 'rgba(255,122,61,.7)'; c.beginPath(); c.arc(x - r * .5, y + r * .8, 6 + Math.sin(G.time * 8) * 2, 0, 7); c.fill(); c.beginPath(); c.arc(x + r * .5, y + r * .8, 5 + Math.cos(G.time * 7) * 2, 0, 7); c.fill(); }
    // HP 條
    const bw = e.def.tier === 'boss' ? 170 : 110;
    const bh = 15, bx = x - bw / 2, by = y - r - 42;
    c.fillStyle = 'rgba(0,0,20,.65)'; c.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    c.fillStyle = '#3a2a4a'; c.fillRect(bx, by, bw, bh);
    const hpR = e.hp / e.maxHp;
    const hg = c.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, '#ff5a6e'); hg.addColorStop(1, '#ffd94e');
    c.fillStyle = hg; c.fillRect(bx, by, bw * Math.max(0, hpR), bh);
    if (e.block > 0){
      c.fillStyle = 'rgba(90,200,255,.85)';
      c.fillRect(bx, by - 3, bw * Math.min(1, e.block / 30), 3);
    }
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1;
    c.strokeRect(bx - 1, by - 1, bw + 2, bh + 2);
    // 血量數字（條上方，加大 + 深色底襯）
    c.font = '900 24px sans-serif'; c.textAlign = 'center';
    const hpw = 34 + String(e.hp).length * 13;
    c.fillStyle = 'rgba(0,0,20,.6)';
    c.beginPath(); c.roundRect(x - hpw / 2, by - 24, hpw, 24, 7); c.fill();
    c.fillStyle = '#fff';
    c.fillText(String(e.hp), x, by - 7);
    // 名稱（加大）
    c.fillStyle = 'rgba(234,246,255,.95)'; c.font = '900 22px "Segoe UI",sans-serif';
    c.textAlign = 'center';
    c.fillText(e.def.name, x, by - 34);
    // 意圖（下一動）
    this.drawIntent(c, e, x, by + bh + 26);
    // Buffs
    this.drawBuffs(c, e.buffs, x, y + r + 46, e.def.tier === 'boss');
  },
  drawIntent(c, e, x, y){
    if (e.dead) return;
    const pat = (e.phase2 && e.def.pat2) ? e.def.pat2 : e.def.pat;
    const it = pat[e.idx % pat.length];
    const icon = it.i === 'atk' ? '⚔️' : it.i === 'def' ? '🛡️' : it.i === 'buf' ? '⬆️' : it.i === 'deb' ? '💀' : '✚';
    const d = it.d || '';
    c.font = '24px sans-serif'; c.textAlign = 'center';
    c.fillStyle = 'rgba(0,0,20,.5)';
    const w = 56;
    c.beginPath(); c.roundRect(x - w / 2, y - 19, w, 38, 9); c.fill();
    c.fillText(icon, x, y + 8);
    if (d){ c.font = '900 18px sans-serif'; c.fillStyle = '#ffd94e'; c.fillText(String(d), x, y + 24); }
  },
  drawBuffs(c, buffs, x, y, big, huge){
    c.font = '13px "Segoe UI",sans-serif'; c.textAlign = 'center';
    let i = 0;
    const cols = { str:'#ff9d4e', dex:'#4ef7ff', weak:'#b06bff', vuln:'#ff5a6e', burn:'#ff7a3d', pois:'#6bff8e', regen:'#6bff8e', thorns:'#9dffb0' };
    const names = { str:'力', dex:'敏', weak:'虛', vuln:'易', burn:'燃', pois:'侵', regen:'再', thorns:'荊' };
    for (const k in buffs){
      if (!buffs[k]) continue;
      const bw = huge ? 78 : big ? 64 : 56;
      const bx = x + (i - 1.5) * bw;
      c.fillStyle = cols[k] + '33';
      c.beginPath(); c.roundRect(bx - 13, y - (huge ? 24 : 21), bw + (huge ? 18 : 16), huge ? 48 : 42, huge ? 10 : 9); c.fill();
      c.fillStyle = cols[k];
      c.font = '900 ' + (huge ? 28 : 24) + 'px sans-serif';
      c.fillText(names[k] + buffs[k], bx + 2, y + (huge ? 6 : 5));
      i++;
    }
    c.font = '13px sans-serif';
  },
  drawPlayer(c, P, dt){
    const x = 360;
    let y = 800; // 手機基準：上移避免被下方手牌遮擋
    // 短視窗（桌面/橫屏）動態上移，確保血條/狀態不被手牌蓋住（預留 200px）
    const hl = this.handLogical || 180;
    if (G.viewH - hl - 200 < y) y = Math.max(430, G.viewH - hl - 200);
    // 玩家光暈
    const col = Run.charDef ? Run.charDef.color : '#4ef7ff';
    const gr = c.createRadialGradient(x, y, 10, x, y, 90);
    gr.addColorStop(0, col + '44'); gr.addColorStop(1, 'transparent');
    c.fillStyle = gr; c.beginPath(); c.arc(x, y, 90, 0, 7); c.fill();
    c.save(); c.translate(x, y);
    c.shadowColor = col; c.shadowBlur = 18;
    c.fillStyle = col;
    if (Run.char === 'xia'){
      c.beginPath(); c.moveTo(0, -34); c.lineTo(20, 26); c.lineTo(0, 14); c.lineTo(-20, 26); c.closePath(); c.fill();
      c.fillStyle = '#ffd94e';
      c.beginPath(); c.moveTo(0, -34); c.lineTo(6, 6); c.lineTo(0, 14); c.lineTo(-6, 6); c.closePath(); c.fill();
    } else if (Run.char === 'yan'){
      c.beginPath(); c.moveTo(0, -38); c.lineTo(24, 0); c.lineTo(0, 12); c.lineTo(-24, 0); c.closePath(); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -38); c.lineTo(0, 12); c.stroke();
    } else {
      c.beginPath(); c.moveTo(0, -34); c.lineTo(28, -20); c.lineTo(28, 16); c.lineTo(0, 32); c.lineTo(-28, 16); c.lineTo(-28, -20); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.arc(0, -4, 8, 0, 7); c.fill();
    }
    c.shadowBlur = 0; c.restore();
    // 護甲盾
    if (P.block > 0){
      c.strokeStyle = 'rgba(157,255,176,.75)'; c.lineWidth = 3;
      c.beginPath(); c.arc(x, y, 46, .5, 2.6); c.stroke();
      c.fillStyle = '#7dff9e'; c.font = '900 20px sans-serif'; c.textAlign = 'center';
      c.fillText(String(P.block), x, y + 64);
    }
    // HP 條（加高 + 數字加大）
    const bw = 240, bx = x - bw / 2, by = y + 84;
    c.fillStyle = 'rgba(0,0,20,.65)'; c.fillRect(bx - 1, by - 1, bw + 2, 26 + 2);
    c.fillStyle = '#2a1a2a'; c.fillRect(bx, by, bw, 26);
    const hpR = Math.max(0, P.hp / P.maxHp);
    const hg = c.createLinearGradient(bx, 0, bx + bw, 0);
    hg.addColorStop(0, hpR > .5 ? '#6bff8e' : '#ffd94e'); hg.addColorStop(1, hpR > .5 ? '#2fd46a' : '#ff7a3d');
    c.fillStyle = hg; c.fillRect(bx, by, bw * hpR, 26);
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.strokeRect(bx - 1, by - 1, bw + 2, 28);
    c.fillStyle = '#fff'; c.font = '900 26px sans-serif'; c.textAlign = 'center';
    c.fillText(`${P.hp} / ${P.maxHp}`, x, by + 20);
    // 玩家 Buffs（huge 版：28px，下移避開加高的血條）
    this.drawBuffs(c, P.buffs, x, y + 148, true, true);
    // 能量（加大）
    c.font = '900 24px sans-serif';
    c.fillStyle = P.energy > 0 ? '#4ef7ff' : '#678';
    c.fillText('⚡ ' + P.energy, x, y - 58);
  }
};
/* ===== 星穹牌局 u1_ui.js — 畫面控制/卡片/戰鬥 UI ===== */
'use strict';

  toast(msg){

    this.toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
  },
  banner(msg){
    const el = $('turn-banner');

    el.classList.add('show');
  },

  /* ---------- 主選單 ---------- */
  renderTitleChars(){
    const row = $('title-char-row');
    row.innerHTML = '';
    for (const id in CHARACTERS){
      const c = CHARACTERS[id];
      const b = document.createElement('div');
      b.className = 'char-btn' + (this.selChar === id ? ' sel' : '');
      b.innerHTML = `<div class="cb-icon">${c.icon}</div><div class="cb-name">${c.name.split('·')[1] || c.name}</div>` +
        (c.unlock > 0 && Save.gems < c.unlock ? `<div class="cb-lock">🔒 ${c.unlock}💎</div>` : '');
      if (c.unlock === 0 || Save.gems >= c.unlock){
        onTap(b, () => {
          this.selChar = id;
          this.renderTitleChars();
          AudioSys.play('click');
        });
      } else {
        b.style.opacity = .5;
      }
      row.appendChild(b);
    }
  },
  renderDiff(){
    const row = $('diff-row');
    row.innerHTML = '';
    for (let d = 0; d <= 5; d++){
      const b = document.createElement('div');
      const unlocked = Save.diffUnlocked(d);
      b.className = 'diff-btn' + (this.selDiff === d ? ' sel' : '') + (unlocked ? '' : ' locked');
      b.textContent = d === 0 ? '★' : '☠' + d;
      b.title = '難度 ' + d;
      if (unlocked) onTap(b, () => { this.selDiff = d; this.renderDiff(); AudioSys.play('click'); });
      row.appendChild(b);
    }
  },
  showTitle(){
    showScreen('title');
    $('title-gems').textContent = `💎 星塵：${Save.gems}　🏆 成就：${Object.keys(Save.ach).length}/${ACHIEVEMENTS.length}　🏁 勝場：${Save.stats.wins}`;
  },

  /* ---------- 地圖 ---------- */
  showMap(){
    showScreen('map');
    $('map-title').textContent = Run.node && Run.node.type === 'boss' ? '最終決戰' : ACTS[Run.act].name;
    $('map-act').textContent = ACTS[Run.act].sub + ' · 第 ' + Run.floor + ' 層' +
      (Run.node && Run.node.type === 'boss' ? ' · ' + ACTS[Run.act].bossLine : '') +
      ' · 難度 ' + Run.diff;
    const cv = $('map-canvas');
    cv.onclick = e => {
      const n = MapView.hitTest(e);
      if (n) this.travelTo(n);
    };
    this.hideTop();
    setTimeout(() => MapView.draw(), 30);
  },
  travelTo(n){
    if (!Run.node.next.some(x => x.id === n.id)) return;
    AudioSys.play('click');
    Run.travelTo(n);
  },
  hideTop(){
    $('topbar').classList.add('hidden');
    $('hand').classList.add('hidden');
    $('end-turn-box').classList.add('hidden');
    $('potions').classList.add('hidden');
    $('banner-hint').classList.add('hidden');
  },

  /* ---------- 戰鬥 ---------- */
  enterCombat(){
    showScreen('combat');
    $('topbar').classList.remove('hidden');
    $('hand').classList.remove('hidden');
    $('end-turn-box').classList.remove('hidden');
    $('potions').classList.remove('hidden');
    $('banner-hint').classList.remove('hidden');
    $('banner-hint').textContent = '卡片自動鎖定最前方敵人 · 點擊打牌';
    this.refreshCombat();
  },
  refreshCombat(){
    Render.handLogical = (($('hand').classList.contains('wrap') ? 232 : 132)) / (G.scale || 1);
    const C = Combat.C;
    if (!C) return;
    const P = C.player;
    // 能量（超過上限時顯示實際顆數，不再被 maxEnergy 蓋掉）
    const en = $('energy');
    en.innerHTML = '';
    for (let i = 0; i < Math.max(P.maxEnergy, P.energy); i++){
      const d = document.createElement('div');
      d.className = 'energy-pip' + (i < P.energy ? '' : ' used');
      en.appendChild(d);
    }
    $('turn-num').textContent = C.turn;
    $('pile-draw').textContent = P.draw.length;
    $('pile-disc').textContent = P.disc.length;
    $('gold-amt').textContent = Run.gold;
    this.renderHand();
    this.renderPotions();
  },
  sortHand(){
    const C = Combat.C;
    if (!C) return;
    C.player.hand.sort((a, b) => {
      const A = CARDS[a.id], B = CARDS[b.id];
      return (A.cost - B.cost) || (A.type === 'attack' ? 0 : 1) - (B.type === 'attack' ? 0 : 1);
    });
    this.renderHand();
  },
  renderHand(){
    const C = Combat.C;
    if (!C) return;
    const box = $('hand');
    box.innerHTML = '';
    if (C.player.hand.length > 6) box.classList.add('wrap'); else box.classList.remove('wrap');
    C.player.hand.forEach((card, i) => {
      const data = CARDS[card.id];
      if (!data) return; // 防呆：無效卡直接跳過（不崩潰）
      const el = this.cardEl(card, { clickable: true });
      const v = cardVals(data, card.up);
      if (v.cost > C.player.energy) el.classList.add('dim');
      onTap(el, () => { Combat.playCard(i); });
      box.appendChild(el);
    });
  },
  renderPotions(){
    const C = Combat.C;
    if (!C) return;
    const box = $('potions');
    box.innerHTML = '';
    const maxP = 2 + (Run.hasRelic('space_pack') ? 1 : 0);
    Run.potions.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'pot';
      d.textContent = p.id === 'heal' ? '🩸' : p.id === 'energy' ? '⚡' : '💥';
      d.title = (p.id === 'heal' ? '奈米修復液：回復 30 生命' : p.id === 'energy' ? '過載電池：+3 能量' : '燃燒彈藥：對所有敵人造成 15 傷害') + `（剩 ${p.count}）`;
      onTap(d, () => Combat.usePotion(i));
      box.appendChild(d);
    });
    for (let i = Run.potions.length; i < maxP; i++){
      const d = document.createElement('div');
      d.className = 'pot';
      d.style.opacity = .18;
      d.textContent = '·';
      box.appendChild(d);
    }
  },

  /* ---------- 卡片 DOM ---------- */
  cardEl(card, opts){
    opts = opts || {};
    const data = typeof card === 'string' ? CARDS[card] : CARDS[card.id];
    if (!data) return document.createElement('span');
    const v = cardVals(data, !!card.up);
    const el = document.createElement('div');
    el.className = 'card rarity-' + data.rarity + (card.up ? ' upgraded' : '');
    el.innerHTML = `
      <div class="c-cost">${v.cost}</div>
      <div class="c-icon">${data.icon}</div>
      <div class="c-name">${data.name}${card.up ? ' ✦' : ''}</div>
      <div class="c-desc">${cardDesc(v, !!card.up)}</div>
      <div class="c-type ${data.type}">${data.type === 'attack' ? '攻擊' : data.type === 'skill' ? '技能' : '能力'}</div>`;
    if (opts.clickable) el.classList.add('c-playable');
    return el;
  },

  /* ---------- 獎勵 ---------- */
  showReward(lines, tier, opts){
    showScreen('reward');
    const C = Combat.C;
    const box = $('reward-lines');
    box.innerHTML = lines.map(l => `<div style="margin:4px 0;font-size:15px">${l}</div>`).join('');
    // 卡牌獎勵
    const cardBox = $('reward-cards');
    cardBox.innerHTML = '';
    cardBox.classList.remove('hidden');
    const n = 3 + (tier === 'boss' ? 1 : 0) + (Run.hasRelic('double_dice') ? 1 : 0);
    const choices = this.genCardChoices(n);
    let sel = null; // 目前選取的卡（可隨時換選，確定才入牌組）
    const setSel = (idx) => {
      sel = idx;
      document.querySelectorAll('#reward-cards .card').forEach((d, j) => {
        d.style.outline = j === idx ? '3px solid #6bff8e' : '';
        d.style.opacity = j === idx ? 1 : 0.3;
      });
    };
    choices.forEach((id, i) => {
      const el = this.cardEl({ id, up: false });
      onTap(el, () => {
        AudioSys.play('card');
        setSel(i);
      });
      cardBox.appendChild(el);
    });
    const btn = $('btn-reward-done');
    btn.onclick = () => {
      if (sel === null){ this.toast('先選一張牌！'); return; }
      Run.addCard(choices[sel]);
      AudioSys.play('click');
      // 先取 tier / boss 資料再清空戰鬥
      const C0 = Combat.C;
      const nt = C0 ? C0.nodeType : 'normal';
      const bossDef = C0 && C0.enemies[0] ? C0.enemies[0].def : null;
      Combat.C = null;
      Run.afterCombat(nt, bossDef);
    };
  },
  genCardChoices(n){
    const poolMap = { common: 55, uncommon: 32, rare: 13 };
    const out = [];
    for (let i = 0; i < n; i++){
      const r = pickW(['common', 'uncommon', 'rare'], r => poolMap[r]);
      out.push(Math.random() < 0.12 ? pick(Object.keys(CARDS).filter(id => CARDS[id].rarity === r)) : Run.randomCard(r));
    }
    return out;
  }
};

      const d = document.createElement('div');

    else if (mode === 'remove') pool = Run.deck.slice();
    else pool = this.genCardChoices(3 + (Save.metaLv('cardChoicePlus') ? 1 : 0));
    if (!pool.length){ this.toast('沒有可選的卡牌'); cb && cb(); return; }
    pool.forEach((c, i) => {

            .filter(([k]) => (u[k] || 0) !== (b[k] || 0))
            .map(([k, label]) => label + ' ' + b[k] + '→' + u[k]).join('、');
          this.toast('✦ 已強化：' + CARDS[c.id].name + (chg ? '（' + chg + '）' : ''));

    const s = G.screen;
    const act = {
      combat: () => this.showPause(),
      map: () => this.showPause(),
      pause: () => this.resume(),
      deck: () => this.resume(),
      result: () => this.showTitle(),
      meta: () => this.showTitle(),
      ach: () => this.showTitle(),
      help: () => this.showTitle(),
      shop: () => this.showMap(),
      camp: () => this.showMap(),
      event: () => this.showMap(),
      pick: () => { const f = this.pickBack; this.pickBack = null; (f || this.showMap).call(this); }
    };
    const fn = act[s];
    if (!fn){ this.showTitle(); return; }
    AudioSys.play('click');
    fn();
  },

  /* ---------- 星塵商店 ---------- */
  renderMeta(){
    showScreen('meta');
    $('meta-gems').textContent = Save.gems;
    const grid = $('meta-grid');
    grid.innerHTML = '';
    META_UPGRADES.forEach(m => {
      const lv = Save.metaLv(m.id);
      const maxed = lv >= m.max;
      const cost = maxed ? 0 : m.costs[lv];
      const d = document.createElement('div');
      d.className = 'shop-item';
      d.innerHTML = `<div class="si-icon">${m.icon}</div>
        <div><div class="si-name">${m.name} <span class="tiny">Lv ${lv}/${m.max}</span></div>
        <div class="si-desc">${maxed ? m.desc + '（已滿級）' : m.lvDesc(lv + 1)}</div></div>
        <div class="si-price">${maxed ? 'MAX' : cost + '💎'}</div>`;
      if (!maxed) onTap(d, () => {
        if (Save.buyMeta(m.id)){ AudioSys.play('upgrade'); this.renderMeta(); }
        else { AudioSys.play('error'); this.toast('星塵不足！'); }
      });
      grid.appendChild(d);
    });
  },

  /* ---------- 成就 ---------- */
  renderAch(){
    showScreen('ach');
    const box = $('ach-list');
    box.innerHTML = '';
    ACHIEVEMENTS.forEach(a => {
      const got = !!Save.ach[a.id];
      const d = document.createElement('div');
      d.className = 'ach-item' + (got ? '' : ' locked');
      d.innerHTML = `<div class="ai-icon">${got ? a.icon : '🔒'}</div><div>${a.name}<div class="tiny">${a.desc}</div></div>`;
      box.appendChild(d);
    });
  },

  /* ---------- 說明 ---------- */
  showHelp(){
    showScreen('help');
    $('help-text').innerHTML = [
      '🎴 目標：沿著地圖路徑前進，擊敗每幕的 Boss，最終在第 3 幕擊敗「歸零者」。',
      '⚡ 每回合獲得 3 點能量，打出卡牌消耗能量；結束回合後敵人行動。',
      '🎯 攻擊牌自動鎖定最前方敵人，AOE 牌攻擊全體。',
      '🔥 燃燒/侵蝕會疊加層數，在目標行動結束時造成等量傷害並遞減；「歸零爆發」「收割者」可一次性引爆。',
      '🃏 能力牌整場戰鬥生效；卡牌可在休息點或事件中強化（✦）。',
      '💎 擊敗敵人獲得金幣與星塵；星塵用於解鎖角色、永久升級與成就。',
      '📱 支援手機：直屏滿屏、點擊打牌、右上暫停。'
    ].join('<br><br>');
  },

  /* ---------- 綁定 ---------- */
  bind(){
    UI.autoEnd = false;
    try{ UI.autoEnd = localStorage.getItem('starcards_autoend') === '1'; }catch(e){}
    const aeBtn = $('btn-autoend');
    if (aeBtn) aeBtn.classList.toggle('on', UI.autoEnd);
    onTap($('btn-autoend'), function(){
      UI.autoEnd = !UI.autoEnd;
      this.classList.toggle('on', UI.autoEnd);
      try{ localStorage.setItem('starcards_autoend', UI.autoEnd ? '1' : '0'); }catch(e){}
      AudioSys.play('click');
      UI.toast(UI.autoEnd ? '⚡ 已開啟自動結束回合' : '已關閉自動結束回合');
    });
    onTap($('btn-run'), () => {
      const c = CHARACTERS[this.selChar];
      if (c.unlock > 0 && Save.gems < c.unlock){ this.toast('星塵不足，無法解鎖此角色'); return; }
      AudioSys.play('click');
      Run.newRun(this.selChar, this.selDiff);
      this.showMap();
    });
    onTap($('btn-meta'), () => this.renderMeta());
    onTap($('btn-ach'), () => this.renderAch());
    onTap($('btn-help'), () => this.showHelp());
    onTap($('btn-meta-back'), () => this.showTitle());
    onTap($('btn-ach-back'), () => this.showTitle());
    onTap($('btn-help-back'), () => this.showTitle());
    onTap($('btn-end'), () => { AudioSys.play('click'); Combat.endTurn(); });
    onTap($('btn-pause'), () => { AudioSys.play('click'); this.showPause(); });
    onTap($('btn-resume'), () => this.resume());
    onTap($('btn-deck-open'), () => this.showDeckView());
    onTap($('btn-map-open'), () => { if (Run.started && !Combat.C) this.showMap(); });
    onTap($('btn-quit-run'), () => { Run.endRun(false); });
    onTap($('btn-deck-close'), () => this.resume());
    onTap($('btn-shop-skip'), () => { AudioSys.play('click'); this.showMap(); });
    onTap($('btn-back'), () => this.goBack());
  }
});

document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
