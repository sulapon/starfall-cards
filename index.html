<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊戲中心 GAME HUB</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e1a">
<meta name="description" content="遊戲中心 - 手機可安裝的遊戲入口 PWA">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遊戲中心">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#111a3a,#05070f);
  color:#eaf6ff;font-family:"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:28px;letter-spacing:4px;margin-bottom:8px;
  background:linear-gradient(90deg,#4ef7ff,#ff4ef0,#ffd94e);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(78,247,255,.3)}
.sub{color:#9db4d8;font-size:14px;letter-spacing:2px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;width:min(720px,100%)}
.card{background:linear-gradient(160deg,#141d40,#0b1128);border:1px solid rgba(78,247,255,.35);border-radius:16px;
  padding:26px 20px;text-align:center;cursor:pointer;text-decoration:none;color:inherit;transition:.25s;
  box-shadow:0 0 16px rgba(78,247,255,.12)}
.card:hover{transform:translateY(-6px);box-shadow:0 0 28px rgba(78,247,255,.35);border-color:#4ef7ff}
.card .ico{font-size:44px;margin-bottom:14px}
.card h2{font-size:18px;letter-spacing:1px;margin-bottom:8px}
.card p{color:#9db4d8;font-size:13px;line-height:1.5}
.badge{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:20px;font-size:12px;
  background:rgba(78,247,255,.15);color:#4ef7ff;border:1px solid rgba(78,247,255,.5)}
footer{margin-top:40px;color:#4a5a7a;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
  <h1>🎮 遊戲中心</h1>
  <div class="sub">GAME HUB · 點擊任一遊戲即可開始</div>
  <div class="grid">

    <!-- 遊戲項目：星穹守護者 -->
    <a class="card" href="astra-survivor/">
      <div class="ico">🌌</div>
      <h2>星穹守護者</h2>
      <p>生存射擊 · ASTRA SURVIVOR</p>
      <span class="badge">▶ 開始遊玩</span>
    </a>

    <!-- 遊戲項目：星穹牌局 -->
    <a class="card" href="card-game/">
      <div class="ico">🃏</div>
      <h2>星穹牌局</h2>
      <p>卡牌桌遊 · STARFALL CARDS</p>
      <span class="badge">▶ 開始遊玩</span>
    </a>

    <!-- 遊戲項目：命運編年史 -->
    <a class="card" href="chronicle-of-destiny/">
      <div class="ico">📜</div>
      <h2>命運編年史</h2>
      <p>史詩冒險 · CHRONICLE OF DESTINY</p>
      <span class="badge">▶ 開始遊玩</span>
    </a>

  </div>
  <footer>GAME HUB · 新增遊戲請告知 Minis</footer>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.warn('SW registration failed', e);
      });
    });
  }
</script>
</body>
</html>
