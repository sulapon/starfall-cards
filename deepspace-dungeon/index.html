<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>深空地牢 · Deepspace Dungeon</title>
<style>
:root{--neon:#5ef;--gold:#ffd75e;--cyan:#3ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Segoe UI',system-ui,'PingFang TC','Noto Sans TC',sans-serif;color:#cfe9ff}
#cv{position:fixed;inset:0;display:block;background:#070812;touch-action:none}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:radial-gradient(ellipse at center,rgba(12,16,40,.78),rgba(3,4,12,.96));transition:opacity .22s;padding:16px}
.ov.hidden{opacity:0;pointer-events:none}
h1.title{font-size:clamp(30px,7vw,64px);font-weight:900;letter-spacing:4px;text-shadow:0 0 18px var(--cyan),0 0 60px var(--cyan);color:#dffcff;margin-bottom:2px;text-align:center}
.sub{color:#8fb7d8;letter-spacing:6px;font-size:clamp(10px,2vw,15px);margin-bottom:14px;text-transform:uppercase}
.panel{background:rgba(8,14,30,.85);border:1px solid rgba(90,200,255,.35);border-radius:14px;box-shadow:0 0 24px rgba(60,180,255,.18) inset,0 6px 30px rgba(0,0,0,.6);padding:18px 22px;max-width:720px;width:min(92vw,640px);text-align:center}
.panel h2{font-size:18px;color:var(--cyan);margin-bottom:10px;letter-spacing:2px}
.kbd{display:inline-block;background:#101c30;border:1px solid #2e4a6e;border-bottom-width:3px;border-radius:6px;padding:2px 8px;font-size:12px;color:#aee;margin:0 2px}
.ctrl{border-top:1px dashed rgba(90,200,255,.25);margin-top:12px;padding-top:12px;text-align:left;font-size:13px;color:#9cc}
.ctrl b{color:var(--cyan)}
.cards{display:flex;gap:12px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.ccard{flex:1;min-width:130px;max-width:190px;background:rgba(10,20,42,.9);border:1px solid rgba(90,200,255,.3);border-radius:12px;padding:14px 12px;cursor:pointer;transition:all .15s;text-align:center}
.ccard:hover,.ccard.sel{border-color:var(--cyan);box-shadow:0 0 18px rgba(70,220,255,.35);transform:translateY(-2px)}
.ccard.sel{background:rgba(20,60,90,.55)}
.ccard .cn{font-size:17px;font-weight:800;color:var(--cyan);margin-bottom:4px}
.ccard .cd{font-size:12px;color:#9cc;line-height:1.5}
.btn{display:inline-block;margin-top:14px;padding:12px 34px;font-size:17px;font-weight:800;color:#04121c;background:linear-gradient(180deg,#7ff,#2ec8ff);border:none;border-radius:10px;cursor:pointer;letter-spacing:3px;box-shadow:0 0 22px rgba(80,220,255,.5);transition:all .15s}
.btn:hover{filter:brightness(1.15);transform:scale(1.04)}
.btn.ghost{background:linear-gradient(180deg,#7a86a8,#3b4a70);color:#eaf6ff;box-shadow:none}
.btn.sm{padding:9px 20px;font-size:14px;letter-spacing:1px}
.best{font-size:13px;color:var(--gold);margin-top:8px;letter-spacing:1px}
.upcard{width:200px;background:rgba(10,20,42,.92);border:1px solid rgba(90,200,255,.4);border-radius:14px;padding:16px 14px;cursor:pointer;transition:all .15s;text-align:center;position:relative}
.upcard:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,94,.4);transform:translateY(-3px)}
.upcard .k{position:absolute;top:8px;left:12px;color:#456;font-size:12px;border:1px solid #2e4a6e;border-radius:5px;padding:1px 7px}
.upcard .un{font-size:16px;font-weight:800;color:var(--gold);margin-top:6px}
.upcard .ud{font-size:12px;color:#9cc;line-height:1.55;margin-top:6px;min-height:58px}
.lv{color:#7ae;letter-spacing:2px;font-size:14px;margin-bottom:8px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stat{display:flex;gap:16px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.stat div{background:rgba(10,20,42,.8);border:1px solid rgba(90,200,255,.25);border-radius:10px;padding:8px 18px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--cyan)}
.stat span{font-size:12px;color:#8fb}
#banner{position:fixed;top:22%;left:0;right:0;text-align:center;z-index:15;pointer-events:none;font-size:clamp(28px,6vw,52px);font-weight:900;color:#eafcff;letter-spacing:10px;text-shadow:0 0 24px var(--cyan),0 0 80px var(--cyan);opacity:0;transition:opacity .5s}
#banner.show{opacity:1}
#banner small{display:block;font-size:clamp(13px,2.6vw,20px);letter-spacing:4px;color:#9fe;font-weight:600;margin-top:4px;text-shadow:0 0 14px var(--cyan)}
#joyB{position:fixed;left:34px;bottom:34px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(90,200,255,.35);background:radial-gradient(circle, rgba(90,200,255,.08), rgba(10,20,42,.25));pointer-events:none;z-index:13}
#joyK{position:fixed;left:34px;bottom:34px;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle, rgba(90,220,255,.55), rgba(90,220,255,.25));border:2px solid rgba(90,220,255,.9);pointer-events:none;z-index:14;box-shadow:0 0 16px rgba(90,220,255,.55), inset 0 0 10px rgba(255,255,255,.2)}
#dashB{position:fixed;right:30px;bottom:44px;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,215,94,.6);background:radial-gradient(circle, rgba(255,215,94,.22), rgba(255,215,94,.08));color:var(--gold);font-weight:800;display:none;align-items:center;justify-content:center;pointer-events:auto;font-size:15px;letter-spacing:1px;z-index:13;box-shadow:0 0 14px rgba(255,215,94,.4)}
.hint{font-size:12px;color:#689;margin-top:10px;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="banner"></div>

<div class="ov" id="title">
  <h1 class="title">深空地牢</h1>
  <div class="sub">D E E P S P A C E · D U N G E O N</div>
  <div class="panel">
    <h2>選擇你的機師</h2>
    <div class="cards" id="classCards"></div>
    <div class="ctrl">
      <span class="kbd">W A S D</span>/<span class="kbd">←↑↓→</span> 移動　<span class="kbd">滑鼠</span> 瞄準<br>
      <span class="kbd">左鍵</span> 射擊　<span class="kbd">空白/Shift</span> 衝刺(無敵)　<span class="kbd">P</span> 暫停<br>
      <span class="kbd">M</span> 音效　<span class="kbd">R</span> 手動重啟　手機顯示搖桿
    </div>
    <div class="best" id="bestT"></div>
    <button class="btn" id="playBtn">進 入 地 牢</button>
  </div>
</div>

<div class="ov hidden" id="levelup">
  <div class="panel">
    <h2 id="luTitle">等級提升</h2>
    <div class="lv" id="luLv">選擇一項強化</div>
    <div class="lrow" id="luCards" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px"></div>
    <div class="hint">按 <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> 或點擊卡片選擇</div>
  </div>
</div>

<div class="ov hidden" id="gameover">
  <div class="panel">
    <h1 class="title" style="font-size:40px;color:#ff8899;text-shadow:0 0 18px #f66">任務失敗</h1>
    <div class="sub">DEEPSPACE DUNGEON OVER</div>
    <div class="stat" id="goStats"></div>
    <div class="best" id="goBest"></div>
    <div class="row">
      <button class="btn won" id="retryBtn">重新開始</button>
      <button class="btn ghost sm" id="menuBtn">回主選單</button>
    </div>
  </div>
</div>

<div class="ov hidden" id="pause">
  <div class="panel">
    <h2>暫 停</h2>
    <div class="row">
      <button class="btn" id="resumeBtn">繼續</button>
      <button class="btn ghost sm" id="quitBtn">結束回主選單</button>
    </div>
  </div>
</div>

<div class="ov hidden" id="win">
  <div class="panel">
    <h1 class="title" style="font-size:40px;color:var(--gold);text-shadow:0 0 18px var(--gold)">通 關 ！</h1>
    <div class="sub">THE DUNGEON FALLS</div>
    <div class="stat" id="winStats"></div>
    <div class="row"><button class="btn" id="winBtn">再來一輪</button></div>
  </div>
</div>

<div id="joyB"></div>
<div id="joyK"></div>
<div id="dashB"></div>


<script>
// ============================================================
// 深空地牢 · Deepspace Dungeon — 核心引擎 (Part 1)
// ============================================================
'use strict';
const CV = document.getElementById('cv');
const CX = CV.getContext('2d');
let VW = 0, VH = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  CV.width = Math.floor(VW * DPR); CV.height = Math.floor(VH * DPR);
  CV.style.width = VW + 'px'; CV.style.height = VH + 'px';
  CX.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

// ---------- utils ----------
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const angTo = (ax,ay,bx,by)=> Math.atan2(by-ay,bx-ax);

// ---------- 音效 (WebAudio 合成) ----------
let AC = null, sfxMuted = false;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay=0){
  if(sfxMuted) return;
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,delay=0,fLow=800){
  if(sfxMuted) return;
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + delay;
  const n = Math.floor(ac.sampleRate*dur);
  const buf = ac.createBuffer(1,n,ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src = ac.createBufferSource(); src.buffer=buf;
  const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fLow;
  const g = ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
}
const S = {
  shoot(){ tone(880,440,0.055,'square',0.05); },
  spread(){ tone(620,360,0.07,'square',0.05); },
  laser(){ tone(1200,240,0.14,'sawtooth',0.045); },
  missile(){ tone(300,120,0.18,'sawtooth',0.06); noiseBurst(0.12,0.05,0,900); },
  chain(){ tone(1600,300,0.12,'triangle',0.07); },
  plasma(){ tone(220,60,0.25,'sine',0.1); },
  frost(){ tone(900,1400,0.1,'triangle',0.045); },
  hit(){ noiseBurst(0.04,0.05,0,2000); },
  explode(){ noiseBurst(0.28,0.13,0,700); tone(180,40,0.3,'sine',0.12); },
  gem(){ tone(1200,1600,0.06,'sine',0.035); },
  heart(){ tone(700,1100,0.12,'sine',0.07); },
  level(){ tone(520,1040,0.1,'triangle',0.09); tone(780,1560,0.14,'triangle',0.07,0.09); },
  dash(){ tone(300,900,0.1,'sine',0.05); },
  hurt(){ tone(200,70,0.2,'sawtooth',0.1); noiseBurst(0.1,0.07,0,500); },
  door(){ tone(150,120,0.18,'square',0.07); },
  boss(){ tone(90,45,0.7,'sawtooth',0.12); noiseBurst(0.5,0.1,0,300); },
  chest(){ tone(600,900,0.1,'triangle',0.08); tone(900,1400,0.14,'triangle',0.08,0.1); },
};

// ---------- 輸入 ----------
const keys = {};
const KEYMAP = { ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
  KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down', Space:'dash',ShiftLeft:'dash',ShiftRight:'dash',
  KeyP:'pause',Escape:'pause',KeyM:'mute',KeyR:'restart' };
window.addEventListener('keydown', e=>{
  if(KEYMAP[e.code]){ keys[KEYMAP[e.code]] = true; if(e.code!=='ShiftLeft'&&e.code!=='ShiftRight') e.preventDefault(); }
});
window.addEventListener('keyup', e=>{ if(KEYMAP[e.code]) keys[KEYMAP[e.code]]=false; });

// Touch joystick
const joyB = document.getElementById('joyB'), joyK = document.getElementById('joyK'),
      dashB = document.getElementById('dashB');
let joyActive = false, joyID = -1, joyCX=0, joyCY=0;
const touchMode = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if(touchMode){ joyB.style.display='block'; dashB.style.display='flex'; }
let touchAim = 0;
let touchAimSeen = false;
let aimActive = false, aimID = -1, aimCX = 0, aimCY = 0;
CV.addEventListener('pointerdown', e=>{
  if(e.pointerType==='touch'){
    if(e.clientX < VW*0.55 && !joyActive){
      joyActive=true; joyID=e.pointerId; joyCX=e.clientX; joyCY=e.clientY;
      joyB.style.left=(joyCX-80)+'px'; joyB.style.top=(joyCY-80)+'px';
      joyK.style.left=(joyCX-44)+'px'; joyK.style.top=(joyCY-44)+'px';
    } else if(!joyActive && !aimActive && e.clientX>=VW*0.55){
      aimActive=true; aimID=e.pointerId; aimCX=e.clientX; aimCY=e.clientY; touchAimSeen=false;
    }
  }
});
window.addEventListener('pointermove', e=>{
  if(joyActive && e.pointerId===joyID){
    const dx=e.clientX-joyCX, dy=e.clientY-joyCY;
    const d=Math.hypot(dx,dy), m=Math.min(d,72);
    if(d>0){ joyK.style.left=(joyCX-44+dx/d*m)+'px'; joyK.style.top=(joyCY-44+dy/d*m)+'px'; touchAim=Math.atan2(dy,dx); }
  }
  if(aimActive && e.pointerId===aimID){
    const dx=e.clientX-aimCX, dy=e.clientY-aimCY;
    if(Math.hypot(dx,dy)>24){ touchAim=Math.atan2(dy,dx); touchAimSeen=true; }
  }
});
function endAim(e){ if(aimActive && e.pointerId===aimID){ aimActive=false; aimID=-1; touchAimSeen=false; } }
function endJoy(e){ if(joyActive && e.pointerId===joyID){ joyActive=false; joyID=-1; joyK.style.left=(joyCX-28)+'px'; joyK.style.top=(joyCY-28)+'px'; } }
window.addEventListener('pointerup', e=>{ endJoy(e); endAim(e); });
window.addEventListener('pointercancel', e=>{ endJoy(e); endAim(e); });
dashB.addEventListener('pointerdown', e=>{ e.preventDefault(); keys.dash=true; });
dashB.addEventListener('pointerup', ()=>{ keys.dash=false; });

// ---------- 粒子 ----------
let parts = [];
function addParts(x,y,n,opt){
  opt = opt||{};
  const col = opt.col||'#5ef';
  for(let i=0;i<n;i++){
    const a = opt.ang!==undefined ? opt.ang+rnd(-opt.spread||0.5,opt.spread||0.5) : rnd(TAU);
    const sp = rnd(opt.spdMin||30, opt.spdMax||180);
    parts.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rnd(opt.life||0.4, (opt.lifeMax||0.4)+0.35), max:0,
      r:rnd(1.5,(opt.rMax||4)), col, grav:opt.grav||0,
      type:opt.type||'dot' });
    const p = parts[parts.length-1]; p.max = p.life;
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const a = clamp(p.life/p.max,0,1);
    CX.globalAlpha = a;
    CX.fillStyle = p.col;
    CX.beginPath(); CX.arc(p.x,p.y,p.r*a+0.3,0,TAU); CX.fill();
  }
  CX.globalAlpha = 1;
}
// 光暈快取（書寫式漸層）
const glowCache = {};
function glow(col){
  let c = glowCache[col];
  if(c) return c;
  c = document.createElement('canvas'); c.width = 64; c.height=64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32,32,2,32,32,32);
  grad.addColorStop(0, col); grad.addColorStop(0.35, col+'55'); grad.addColorStop(1,'transparent');
  g.fillStyle=grad; g.fillRect(0,0,64,64);
  glowCache[col]=c; return c;
}

// ---------- 浮動文字 ----------
let texts = [];
function addText(x,y,str,col,size){
  texts.push({x:x+rnd(-8,8), y, str, col, size:size||16, life:0.9, max:0.9});
}
function updateTexts(dt){ for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.life-=dt; t.y-=46*dt; if(t.life<=0)texts.splice(i,1);} }
function drawTexts(){
  CX.textAlign='center'; CX.textBaseline='middle';
  for(const t of texts){
    CX.globalAlpha = clamp(t.life/t.max,0,1);
    CX.font = '800 '+t.size+'px "Segoe UI",sans-serif';
    CX.fillStyle = 'rgba(0,0,0,.55)'; CX.fillText(t.str, t.x+2, t.y+2);
    CX.fillStyle = t.col; CX.fillText(t.str, t.x, t.y);
  }
  CX.globalAlpha=1;
}

// ---------- 星空 ----------
let stars = [];
function makeStars(){
  stars = [];
  const n = 180;
  for(let i=0;i<n;i++){
    stars.push({ x:rnd(20000)-10000, y:rnd(12000)-6000, r:rnd(0.6,2.1),
      tw:rnd(0.5,2.5), ph:rnd(TAU), hue:rnd(1) });
  }
}

// ---------- 螢幕震動 & 閃白 ----------
let shake = 0, flashT = 0;
function addShake(v){ shake = Math.min(shake+v, 26); }
function addFlash(v){ flashT = Math.max(flashT, v); }

// ---------- 碰撞（圓 vs AABB 矩形牆）----------
let solids = []; // {x,y,w,h} 世界座標
function collideCircle(x,y,r,dx,dy){
  // 回傳修正後的位置（依軸分離）
  let nx=x+dx, ny=y+dy;
  for(const s of solids){
    const cx = clamp(nx, s.x, s.x+s.w), cy = clamp(ny, s.y, s.y+s.h);
    if(dist2(nx,ny,cx,cy) < r*r){
      // 退回
      const ox = clamp(x, s.x, s.x+s.w), oy = clamp(y, s.y, s.y+s.h);
      let px = x, py = y;
      // X 軸嘗試
      if(dist2(nx,y,ox,oy) >= r*r) px = nx; else if(dist2(x,ny,ox,oy) >= r*r) py = ny;
      nx = px; ny = py;
    }
  }
  return [nx,ny];
}
function circleHitsWall(x,y,r){
  for(const s of solids){
    const cx = clamp(x, s.x, s.x+s.w), cy = clamp(y, s.y, s.y+s.h);
    if(dist2(x,y,cx,cy) < r*r) return true;
  }
  return false;
}
function raycastWalls(x0,y0,x1,y1){
  // 回傳最近牆面命中點（若無命中回傳末端）
  let best = null, bestT = 1;
  const dx=x1-x0, dy=y1-y0;
  for(const s of solids){
    // slab 法
    let tmin=0, tmax=1;
    const invDx = dx!==0?1/dx:1e9, invDy = dy!==0?1/dy:1e9;
    const tx1=(s.x-x0)*invDx, tx2=(s.x+s.w-x0)*invDx;
    const t1=Math.min(tx1,tx2), t2=Math.max(tx1,tx2);
    const ty1=(s.y-y0)*invDy, ty2=(s.y+s.h-y0)*invDy;
    const t3=Math.min(ty1,ty2), t4=Math.max(ty1,ty2);
    tmin = Math.max(tmin,t1,t3); tmax = Math.min(tmax,t2,t4);
    if(tmin<=tmax && tmin>0 && tmin<bestT){ bestT=tmin; }
  }
  return { x:x0+dx*bestT, y:y0+dy*bestT, t:bestT };
}

// ============================================================
// 深空地牢 — 職業、武器、敵人、強化天賦 (Part 2)
// ============================================================

// ---------- 職業定義 ----------
const CLASSES = {
  blaster: { name:'爆破先鋒', icon:'◉', cd:0.18, desc:`快射雷射爆能槍

// 深空地牢 — 房間生成、事件、主遊戲迴圈 (Part 3)
// ============================================================

let floorDef = null; // {cw,ch,rooms,grid}
let curRoom = null;  // {id,x,y,w,h,exits,enemyCount,type,done,boss}
const RM = 56;       // 房間格子大小
const ROOM_TYPES = ['normal','normal','normal','treasure','shop','elite'];

// ---------- 隨機生成地牢 ----------
function generateFloor(floor){
  const cw = 5, ch = 5;
  // 迷宮 (recursive backtracker)
  const grid = Array.from({length:ch},()=>Array(cw).fill(0));
  grid[0][0] = 1;
  const stk = [[0,0]];
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  let cells = 1;
  while(stk.length){
    const [cx,cy] = stk[stk.length-1];
    const opts = [];
    for(const [dx,dy] of dirs){
      const nx=cx+dx*2, ny=cy+dy*2;
      if(nx>=0&&ny>=0&&nx<cw&&ny<ch&&!grid[ny][nx]) opts.push([nx,ny,dx,dy]);
    }
    if(!opts.length){ stk.pop(); continue; }
    const [nx,ny,dx,dy] = pick(opts);
    grid[ny][nx]=1; grid[cy+dy][cx+dx]=1; cells++;
    stk.push([nx,ny]);
  }
  // 選 boss 房：離 0,0 最遠
  let bossRC=[0,0], bd=-1;
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    if(grid[y][x]){ const d = x*x+y*y; if(d>bd){bd=d;bossRC=[x,y];} }
  }
  grid[bossRC[1]][bossRC[0]] = 2;
  // 種子房間
  const rooms = [];
  let id = 0;
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    const g = grid[y][x];
    if(g===0) continue;
    const type = g===2 ? 'boss' : (x===0&&y===0 ? 'start' : 'normal');
    rooms.push({ id:id++, x:x*RM, y:y*RM, w:RM, h:RM, type,
      exits:{}, done:false, boss:false });
  }
  // 通道
  const rmAt = (x,y)=> rooms.find(r=>r.x===x*RM && r.y===y*RM);
  for(const r of rooms){
    const gx = r.x/RM, gy = r.y/RM;
    const check = (dx,dy)=>{
      const t = rmAt(gx+dx, gy+dy);
      if(t){ r.exits[dx+','+dy] = t.id; t.exits[-dx+','+-dy] = r.id; }
    };
    if(grid[gy][gx+1]===1||grid[gy][gx+1]===2) check(1,0);
    if(grid[gy][gx-1]===1||grid[gy][gx-1]===2) check(-1,0);
    if(grid[gy+1]&&(grid[gy+1][gx]===1||grid[gy+1][gx]===2)) check(0,1);
    if(grid[gy-1]&&(grid[gy-1][gx]===1||grid[gy-1][gx]===2)) check(0,-1);
  }
  const bossRoom = rooms.find(r=>r.type==='boss');
  bossRoom.boss = true;
  // 標記一般房 type
  for(const r of rooms){
    if(r.type==='start'||r.type==='boss') continue;
    r.type = pick(ROOM_TYPES);
  }
  floorDef = { cw, ch, rooms };
  return rooms;
}

// ---------- 房間實體化 ----------
function roomSolids(r){
  const arr = [];
  const wallT = 26;
  // 外牆
  arr.push({x:r.x-wallT, y:r.y-wallT, w:r.w+wallT*2, h:wallT});
  arr.push({x:r.x-wallT, y:r.y+r.h, w:r.w+wallT*2, h:wallT});
  arr.push({x:r.x-wallT, y:r.y, w:wallT, h:r.h});
  arr.push({x:r.x+r.w, y:r.y, w:wallT, h:r.h});
  // 內部裝飾柱
  const cx = r.x, cy = r.y, W = r.w, H = r.h;
  if(r.type==='normal'||r.type==='elite'||r.type==='treasure'){
    if(r.type==='normal'){
      if(Math.random()<0.7){
        const px = r.x + rnd(20, r.w-34), py = r.y + rnd(20, r.h-34);
        arr.push({x:px, y:py, w:16, h:16});
      }
      if(Math.random()<0.35){
        const px2 = r.x + rnd(30, r.w-50), py2 = r.y + rnd(30, r.h-50);
        arr.push({x:px2, y:py2, w:14, h:14});
      }
    } else if(r.type==='elite'){
      arr.push({x:cx+W*0.28-14, y:cy+H*0.5-14, w:28, h:28});
      arr.push({x:cx+W*0.72-14, y:cy+H*0.5-14, w:28, h:28});
    }
  }
  return arr;
}

// ---------- 生成敵人波次 ----------
function spawnWave(r, floor){
  const isBoss = r.type==='boss';
  const count = isBoss ? 1 : Math.min(3 + Math.floor(floor*1.4) + rndi(0,2), 14);
  const list = [];
  if(isBoss){
    list.push({ type:'boss', x:r.x+r.w/2, y:r.y+r.h/2 });
  } else {
    const rType = r.type;
    for(let i=0;i<count;i++){
      let t;
      const roll = Math.random();
      if(rType==='elite'){
        t = roll<0.35?'bruiser':roll<0.7?'tank':'spitter';
      } else {
        t = roll<0.45?'grunt':roll<0.75?'runner':roll<0.88?'spitter':roll<0.96?'snipe':'tank';
      }
      const x = r.x + rnd(50, r.w-50), y = r.y + rnd(50, r.h-50);
      list.push({ type:t, x, y });
    }
  }
  return list;
}

// ---------- 寶箱 ----------
function makeChest(r){
  const x = r.x + rnd(60, r.w-60), y = r.y + rnd(60, r.h-60);
  const type = Math.random()<0.25 ? 'weapon' : (Math.random()<0.5 ? 'gem' : 'heart');
  chests.push({ x, y, type, opened:false, r:14 });
}

// ---------- 掉落物 ----------
function dropAt(x,y,floor){
  const roll = Math.random();
  let type = 'gem';
  if(roll < 0.13) type = 'heart';
  else if(roll < 0.2) type = 'weapon';
  drops.push({ x, y, type, r:8, t:0 });
}

// ---------- 遊戲主類別 ----------
class Game {
  constructor(cls, floor, startRoom){
    this.state = 'play'; this.floor = floor; this.cls = cls;
    this.player = new Player(cls);
    this.paused = false;
    this.time = 0;
    this.kills = 0;
    this.damage = 0;
    this.roomCount = 0;
    this.combo = 0; this.comboT = 0; this.comboMax = 0;
    this.score = 0;
    this.room = null;
    this.transition = null;
    this.entered = new Set();
    this.started = false;
    this.setupRoom(startRoom);
    this.player.x = startRoom.x + startRoom.w/2;
    this.player.y = startRoom.y + startRoom.h/2;
    this.bossHpMax = 0;
    this.bossHp = 0;
    this.lastEnter = 0;
    this.spawnT = 2.0;
    this.autoAim = true;   // 自動瞄準最近敵人   // 出生保護時間（避免出生即誤觸出口）
    addText(this.player.x, this.player.y-30, '探索地牢', '#7fe', 16);
  }
  setupRoom(r){
    this.room = r;
    solids = roomSolids(r);
    r.done = r.type==='start' ? true : false;
    if(r.type==='start'){
      // 起始房不刷怪，但有 1 個寶箱
      if(!r.opened){ r.opened=true; makeChest(r); }
    } else {
      const entries = spawnWave(r, this.floor);
      for(const e of entries){
        const def = ENEMY[e.type];
        if(e.type==='boss'){
          const boss = makeBoss(this.floor, r);
          enemies.push(boss);
        } else {
          enemies.push(new Enemy(e.type, e.x, e.y, r));
        }
      }
      if(r.type==='treasure') makeChest(r);
      if(r.type==='shop') makeChest(r);
    }
    doors = [];
    // 門（連結出口）
    for(const dk in r.exits){
      const [dx,dy] = dk.split(',').map(Number);
      const side = dx!==0 ? (dx>0?'R':'L') : (dy>0?'B':'T');
      const wx = dx!==0 ? (dx>0? r.x+r.w-6 : r.x+6) : r.x+r.w/2;
      const wy = dy!==0 ? (dy>0? r.y+r.h-6 : r.y+6) : r.y+r.h/2;
      doors.push({ x:wx, y:wy, side, locked:true });
    }
    this.enterRoomFX();
  }
  enterRoomFX(){
    // burst particles at center
    addParts(this.room.x+this.room.w/2, this.room.y+this.room.h/2, 60, { col:'#5ef', spdMax:220, rMax:4, life:0.7 });
  }
  update(dt){
    if(this.state!=='play') return;
    if(this.paused) return;
    this.time += dt;
    const P = this.player;
    // combo 計時
    if(this.comboT>0){ this.comboT-=dt; if(this.comboT<=0) this.combo=0; }
    // dash cooldown
    if(P.dashCd>0) P.dashCd-=dt;
    if(P.invul>0) P.invul-=dt;
    // 移動
    let mvx = 0, mvy = 0;
    if(keys.left) mvx -= 1;
    if(keys.right) mvx += 1;
    if(keys.up) mvy -= 1;
    if(keys.down) mvy += 1;
    if(joyActive){
      const dx = parseFloat(joyK.style.left)+28 - joyCX;
      const dy = parseFloat(joyK.style.top)+28 - joyCY;
      if(Math.hypot(dx,dy)>8){ mvx = dx/52; mvy = dy/52; }
    }
    const mLen = Math.hypot(mvx,mvy);
    if(mLen>1){ mvx/=mLen; mvy/=mLen; }
    let spd = P.totalSpd;
    if(P.dashTime>0){
      P.dashTime -= dt;
      spd *= 2.5;
    }
    // 沖刺
    if(keys.dash && P.dashCd<=0 && P.dashTime<=0 && mLen>0.05){
      P.dashTime = 0.16;
      P.dashCd = P.dashCdMax * P.dashCdMul;
      P.invul = Math.max(P.invul, 0.2);
      addShake(3);
      tone(300,900,0.12,'sine',0.05);
      if(P.dashDmg>0){
        // 路徑斬擊
        const ax = mvx, ay=mvy;
        for(const e of enemies){
          const k = ((e.x-P.x)*ax+(e.y-P.y)*ay);
          if(k>0 && k<70){
            const d = Math.hypot(e.x-P.x, e.y-P.y);
            if(d<90){ e.hurt(P.finalDmg(P.dmg*1.5), 0, ax, ay); }
          }
        }
      }
      P.x += mvx*34; P.y += mvy*34;
      trail.push({x:P.x,y:P.y,t:0.25});
    } else if(P.dashTime<=0){
      const [nx,ny] = collideCircle(P.x, P.y, P.r, mvx*spd*dt, mvy*spd*dt);
      P.x = nx; P.y = ny;
    } else {
      P.x += mvx*spd*dt; P.y += mvy*spd*dt;
    }
    // 瞄準（手動觸發時用 touchAim，否則交給 autoAim）
    if(touchMode && touchAimSeen){ P.aim = touchAim; }
    // 射擊（自動）
    this.updateShooting(dt);
    // 光束
    for(let i=P.beams.length-1;i>=0;i--){
      const b = P.beams[i];
      b.cool -= dt;
      if(b.cool<=0) P.beams.splice(i,1);
    }
    // 更新彈藥
    updateBullets(dt);
    updateFrostRings(dt);
    updateMissiles(dt);
    updateNovas(dt);
    updateEnemyBullets(dt);
    // 敵人
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.update(dt, P, this);
      if(e.hp<=0){ this.onEnemyKilled(e); enemies.splice(i,1); }
    }
    // 拾取
    for(let i=drops.length-1;i>=0;i--){
      const d = drops[i];
      const dx2 = P.x-d.x, dy2 = P.y-d.y;
      const dist = Math.hypot(dx2,dy2);
      const range = 26 + 60*P.pickup;
      if(dist < range){
        d.x += (dx2/dist)*160*dt; d.y += (dy2/dist)*160*dt;
      }
      if(dist < 20){
        if(d.type==='gem'){ this.combo++; this.comboT=1.2; this.comboMax=Math.max(this.comboMax,this.combo); this.score+=5*this.combo; addText(d.x,d.y,'+'+5*this.combo,'#ffd75e',12); S.gem(); }
        if(d.type==='heart'){ P.hp=Math.min(P.hp+15,P.maxHp); addText(d.x,d.y,'+15 HP','#f88',13); S.heart(); }
        if(d.type==='weapon'){ this.spawnWeaponChoice(d); }
        drops.splice(i,1);
      }
    }
    // 寶箱
    for(let i=chests.length-1;i>=0;i--){
      const c = chests[i];
      if(!c.opened && Math.hypot(P.x-c.x,P.y-c.y) < 26){
        c.opened = true;
        S.chest();
        if(c.type==='weapon') this.spawnWeaponChoice(c);
        else if(c.type==='gem'){ for(let j=0;j<4;j++) drops.push({x:c.x+rnd(-24,24),y:c.y+rnd(-24,24),type:'gem',r:8,t:0}); }
        else { drops.push({x:c.x,y:c.y,type:'heart',r:8,t:0}); }
        addParts(c.x,c.y,40,{col:'#ffd75e',spdMax:160,rMax:3.5,life:0.6});
      }
    }
    // 門解鎖（清除房敵人才開門，start 房延後到 2 秒讓玩家穩定出生）
    if(this.room.type!=='boss'){
      const alive = enemies.some(e=>e.hp>0);
      const unlockT = this.room.type==='start' ? 2.0 : 0;
      if(!alive && this.time>=unlockT){
        for(const d of doors) d.locked = false;
      }
    }
    // 進入新房間
    if(this.spawnT>0) this.spawnT-=dt;
    for(let i=doors.length-1;i>=0;i--){
      const d = doors[i];
      if(d.locked) continue;
      if(this.spawnT>0) continue;   // 出生保護（完整守衛）
      if(this.time-this.lastEnter<0.8) continue;  // 進房緩衝
      if(Math.hypot(P.x-d.x,P.y-d.y)<34){
        // 需朝門方向移動才觸發（避免出生/停留誤觸）
        const toDx = d.x-P.x, toDy = d.y-P.y;
        const dot = toDx*mvx + toDy*mvy;
        if(mLen>0.05 && dot>0){
        const key = d.side==='R'?'1,0':d.side==='L'?'-1,0':d.side==='B'?'0,1':'0,-1';
        const rid = this.room.exits[key];
        if(rid!==undefined){
          S.door();
          this.enterRoom(rid, d.side);
          return; // update 重新開始以刷新陣列
        }
        }
      }
    }
    // 死亡
    if(P.hp<=0){
      P.hp=0; this.state='dead';
      this.onDeath();
    }
  }
  enterRoom(rid, fromSide){
    const nr = floorDef.rooms[rid];
    this.roomCount++;
    // 玩家放到房內中央偏入口反向，確保完全在房內（避開四牆）
    let px = nr.x+nr.w/2, py = nr.y+nr.h/2;
    if(fromSide==='R') px = nr.x+42;
    else if(fromSide==='L') px = nr.x+nr.w-42;
    else if(fromSide==='B') py = nr.y+42;
    else if(fromSide==='T') py = nr.y+nr.h-42;
    this.player.x = px; this.player.y = py;
    this.spawnT = 1.2;   // 進房後保護，玩家需移動離開門口
    this.lastEnter = this.time;
    this.setupRoom(nr);
    // 確保碰到新房的實體碰撞後位置仍在房內
    const r = nr;
    px = Math.max(r.x+this.player.r+4, Math.min(px, r.x+r.w-this.player.r-4));
    py = Math.max(r.y+this.player.r+4, Math.min(py, r.y+r.h-this.player.r-4));
    this.player.x = px; this.player.y = py;
    addText(this.player.x, this.player.y-30, this.describeRoom(nr), '#7fe', 16);
  }
  describeRoom(r){
    switch(r.type){
      case 'treasure': return '寶藏室';
      case 'shop': return '補給艙';
      case 'elite': return '精英艙';
      case 'boss': return '⚠ 亞空間核心';
      default: return '空間艙 '+(this.roomCount+1);
    }
  }
  // ---------- 射擊 ----------
  updateShooting(dt){
    const P = this.player;
    // 自動瞄準：aimMode mouse 且無滑鼠指向時，鎖定最近敵人
    if(this.autoAim && !touchAimSeen){
      let best=null, bd=1e9;
      for(const e of enemies){
        if(e.hp<=0) continue;
        const d = Math.hypot(e.x-P.x, e.y-P.y);
        if(d<bd && d<900){ bd=d; best=e; }
      }
      if(best) P.aim = Math.atan2(best.y-P.y, best.x-P.x);
    }
    // 每把武器獨立冷卻
    for(const w of P.weapons){
      const key = P.weapons.indexOf(w);
      if(!P.cooldowns[key]) P.cooldowns[key] = 0;
      P.cooldowns[key] -= dt;
      if(P.cooldowns[key] <= 0){
        w.fire(P);
        P.cooldowns[key] = w.cd * P.cdMul;
      }
    }
    // 無武器的起始武器
    if(P.weapons.length===0){
      if(!P.cooldowns.__base) P.cooldowns.__base=0;
      P.cooldowns.__base -= dt;
      if(P.cooldowns.__base<=0){
        P.fireBolt();
        P.cooldowns.__base = 0.24 * P.cdMul;
      }
    }
  }
  // 武器實作掛在 Player prototype 下（見下）
  onEnemyKilled(e){
    this.kills++;
    const sc = e.maxScore || e.score;
    this.combo++; this.comboT=1.2; this.comboMax=Math.max(this.comboMax,this.combo);
    this.score += sc * this.combo;
    addText(e.x, e.y, '+'+sc*this.combo, '#ffd75e', 13);
    // 掉落
    if(e.isBoss){
      for(let i=0;i<8;i++) drops.push({x:e.x+rnd(-30,30), y:e.y+rnd(-30,30), type:'gem', r:8, t:0});
      drops.push({x:e.x, y:e.y, type:'heart', r:8, t:0});
      drops.push({x:e.x+20, y:e.y, type:'weapon', r:8, t:0});
      S.boss();
      addShake(10); addFlash(0.35);
      this.endRun(true);
    } else {
      if(Math.random()<0.22) drops.push({x:e.x, y:e.y, type:'gem', r:8, t:0});
      if(Math.random()<0.04) drops.push({x:e.x, y:e.y, type:'heart', r:8, t:0});
      if(Math.random()<0.03) drops.push({x:e.x, y:e.y, type:'weapon', r:8, t:0});
      S.explode();
    }
    addParts(e.x, e.y, 14, { col:e.col, spdMax:220, rMax:3.5, life:0.6 });
    // 升級檢查
    // (level up handled by XP system: 用擊殺數)
    this.checkXP();
  }
  checkXP(){
    // 簡化：每 8 殺升級
    const need = 8 + (this.floor*4);
    if(this.kills % need === 0 && this.kills>0 && this.state==='play'){
      S.level();
      showLevelUp();
    }
  }
  endRun(won){
    if(this.state==='dead'||this.state==='won') return;
    this.state = won?'won':'dead';
    if(won){ showWin(this); } else { showGameOver(this); }
  }
  onDeath(){
    addShake(16); addFlash(0.5);
    addParts(this.player.x, this.player.y, 80, {col:'#5ef',spdMax:300,rMax:5,life:1});
    setTimeout(()=>{ if(game) showGameOver(game); }, 600);
  }
}

// ---------- Player 武器實作 ----------
Player.prototype.fireBolt = function(offset, speedMul, pierce, dmg){
  const P = this; const G = game;
  const ang = P.aim + (offset||0);
  const sm = speedMul || 1;
  const d = dmg || P.finalDmg(P.dmg);
  let shots = [[ang,0]];
  for(let i=0;i<(P.extraShots||0);i++){
    shots.push([ang + rnd(-0.22,0.22), 0]);
  }
  const pen = P.pierce + (pierce||0);
  for(const [a] of shots){
    bullets.push({ x:P.x+Math.cos(a)*16, y:P.y+Math.sin(a)*16, vx:Math.cos(a)*P.projSpeed*sm,
      vy:Math.sin(a)*P.projSpeed*sm, r:5, dmg:d, pen, hit:new Set(), col:P.weapons[P.curWep]?P.weapons[P.curWep].col:'#5ef', life:1.4 });
  }
  S.shoot();
};
Player.prototype.fireFrost = function(){
  const P=this, G=game;
  fsts.push({ x:P.x, y:P.y, r:10, max:150, dmg:P.finalDmg(P.dmg*1.4), t:0.6, hit:new Set(), col:'#aef' });
  S.frost();
};
Player.prototype.fireMissile = function(){
  const P=this, G=game;
  misls.push({ x:P.x, y:P.y, t:0, col:'#fc6', dmg:P.finalDmg(P.dmg*2.2) });
  S.missile();
};
Player.prototype.fireNova = function(){
  const P=this, G=game;
  novas.push({ x:P.x, y:P.y, r:10, max:220, dmg:P.finalDmg(P.dmg*1.8), t:0.5, hit:new Set(), col:'#fe9' });
  S.plasma();
};

// ---------- 彈幕更新 ----------
function updateBullets(dt){
  const P = game && game.player;
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life-=dt;
    if(b.life<=0 || circleHitsWall(b.x,b.y,b.r)){ bullets.splice(i,1); continue; }
    // 命中敵人
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(b.hit.has(e.id)!==undefined && b.hit.has(e.id)) continue;
      if(e.id!==undefined && b.hit.has(e.id)) continue;
      if(Math.hypot(e.x-b.x,e.y-b.y) < e.r+b.r){
        const killed = e.hurt(b.dmg, 0, b.vx, b.vy, b.col);
        b.pen--;
        if(b.pen<0){ bullets.splice(i,1); break; }
        else {
          // 穿透有機率
          b.hit.add(e.id);
          // 鏈式
          if(P && P.chainArc>0 && killed===false){
            for(let k=0;k<P.chainArc;k++){
              let tgt=null, bd=160;
              for(const e2 of enemies){
                if(e2.id===e.id||e2.hp<=0) continue;
                const dd=Math.hypot(e2.x-e.x,e2.y-e.y);
                if(dd<bd){bd=dd;tgt=e2;}
              }
              if(tgt){ tgt.hurt(b.dmg*0.5,0,0,0,b.col); chains.push({x1:e.x,y1:e.y,x2:tgt.x,y2:tgt.y,col:b.col,t:0.15}); }
            }
          }
          // 減速
          if(P && P.applySlow) e.slowT = Math.max(e.slowT||0, 2);
        }
      }
    }
  }
  for(let i=chains.length-1;i>=0;i--){ chains[i].t-=dt; if(chains[i].t<=0) chains.splice(i,1); }
}
function updateFrostRings(dt){
  for(let i=fsts.length-1;i>=0;i--){
    const f=fsts[i]; f.t-=dt; f.r += (f.max-f.r)*0.09;
    for(const e of enemies){
      if(!f.hit.has(e.id) && Math.hypot(e.x-f.x,e.y-f.y)<f.r+e.r){
        f.hit.add(e.id); const killed=e.hurt(f.dmg,0,0,0,f.col); e.slowT=Math.max(e.slowT||0,2.5);
      }
    }
    if(f.t<=0) fsts.splice(i,1);
  }
}
function updateNovas(dt){
  for(let i=novas.length-1;i>=0;i--){
    const n=novas[i]; n.t-=dt; n.r += (n.max-n.r)*0.14;
    for(const e of enemies){
      if(!n.hit.has(e.id) && Math.hypot(e.x-n.x,e.y-n.y)<n.r+e.r){
        n.hit.add(e.id); const killed=e.hurt(n.dmg,0,e.x-n.x,e.y-n.y,n.col);
        if(!killed){ e.hurt(n.dmg*0.3,0,0,0,n.col); }
      }
    }
    if(n.t<=0) novas.splice(i,1);
  }
}
function updateMissiles(dt){
  for(let i=misls.length-1;i>=0;i--){
    const m=misls[i]; m.t+=dt;
    // 找最近敵
    let tgt=null, bd=250;
    for(const e of enemies){ const dd=Math.hypot(e.x-m.x,e.y-m.y); if(dd<bd){bd=dd;tgt=e;} }
    if(tgt){
      const a = angTo(m.x,m.y,tgt.x,tgt.y);
      const sp = 460;
      m.x += Math.cos(a)*sp*dt; m.y += Math.sin(a)*sp*dt;
    }
    // 焰尾
    if(Math.random()<0.5) addParts(m.x,m.y,1,{col:'#fc6',spdMax:60,rMax:2,life:0.25});
    if(tgt && Math.hypot(tgt.x-m.x,tgt.y-m.y) < tgt.r+12){
      for(const e of enemies){ if(Math.hypot(e.x-m.x,e.y-m.y)<70){ e.hurt(m.dmg,0,e.x-m.x,e.y-m.y); } }
      addParts(m.x,m.y,26,{col:'#fc6',spdMax:240,rMax:5,life:0.5});
      addShake(5); S.explode(); misls.splice(i,1); continue;
    }
    if(m.t>3) misls.splice(i,1);
  }
}
function updateEnemyBullets(dt){
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.life<=0||circleHitsWall(b.x,b.y,b.r)){ ebullets.splice(i,1); continue; }
    const P=game && game.player;
    if(P && P.invul<=0 && Math.hypot(P.x-b.x,P.y-b.y)<P.r+b.r){
      P.hurt(b.dmg);
      ebullets.splice(i,1);
    }
    // 光束做為光源會畫出
  }
}

// ---------- 敵人類別 ----------
let ENEMY_UID = 1;
class Enemy {
  constructor(type, x, y, room){
    const d = ENEMY[type];
    this.id = ENEMY_UID++;
    this.type = type; this.x=x; this.y=y;
    this.r = d.r; this.maxHp = d.hp * gameScale(); this.hp = this.maxHp;
    this.baseSpd = d.spd; this.dmg = d.dmg; this.col = d.col;
    this.score = d.score; this.maxScore = d.score;
    this.typeT = d.type; this.proj = d.proj;
    this.slowT = 0; this.knockX = 0; this.knockY = 0; this.kk=0;
    this.chargeCd = rnd(1,3); this.charging=0; this.fireCd = rnd(1,2.5);
    this.aimCd = 0; this.wanderT = rnd(0.5,2); this.wx=this.x; this.wy=this.y;
    this.flash = 0; this.isBoss=false; this.pattern = null;
    this.baseHp = d.hp;
  }
  get scale(){ return gameScale(); }
  hurt(dmg, knock, kx, ky, col){
    this.flash = 0.1;
    const P=game && game.player;
    // 減傷
    const final = dmg;
    this.hp -= final;
    if(P && P.lifesteal>0 && P.hp>0){ P.hp=Math.min(P.hp+final*P.lifesteal, P.maxHp); }
    // 擊退（僅在未在擊退中時設定，避免連續命中無限擊退）
    if(this.kk<=0){
      const k = (knock || (this.baseHp>40? 40: 90)) * (P?Math.max(0.35, P.knockMul||1):1);
      let dx = kx||Math.cos(Math.random()*TAU), dy = ky||Math.sin(Math.random()*TAU);
      const dl = Math.hypot(dx,dy)||1;
      this.knockX = (dx/dl)*k;
      this.knockY = (dy/dl)*k;
      this.kk = 0.14 * (kx||ky ? 2 : 1);
    }
    // 暴擊文字
    if(col) addText(this.x+rnd(-8,8), this.y-this.r, Math.round(final), '#fff', 11);
    // sfx
    if(this.hp<=0){
      if(this.isBoss) return false;
      this.maxScore = Math.max(this.score, this.maxScore);
      return false;
    }
    return true;
  }
  getSpeed(){
    const s = this.baseSpd * (this.slowT>0 ? 0.5 : 1);
    return s;
  }
  update(dt, P, G){
    this.flash = Math.max(0, this.flash-dt);
    this.slowT = Math.max(0, this.slowT-dt);
    // knockback
    if(this.kk>0){ this.kk-=dt; this.x+=this.knockX*dt; this.y+=this.knockY*dt; }
    const d = Math.hypot(P.x-this.x, P.y-this.y);
    let ax = (P.x-this.x)/(d||1), ay=(P.y-this.y)/(d||1);
    // 躲離撞太近 -> 退開
    if(d < 40){ ax=-ax; ay=-ay; }
    let vx=0, vy=0;
    switch(this.type){
      case 'grunt':
        vx=ax*this.getSpeed(); vy=ay*this.getSpeed();
        break;
      case 'runner':
        vx=ax*this.getSpeed(); vy=ay*this.getSpeed();
        break;
      case 'tank':
        vx=ax*this.getSpeed(); vy=ay*this.getSpeed();
        break;
      case 'spitter':
        this.fireCd -= dt;
        if(d<400 && this.fireCd<=0){
          this.fireCd = rnd(1.6,2.4);
          const a = angTo(this.x,this.y,P.x,P.y);
          ebullets.push({x:this.x,y:this.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:7,dmg:this.proj.dmg,life:3,col:this.proj.col});
          tone(this.proj.c,rnd(0.9,1.1),0.09,'sawtooth',0.04);
        } else {
          if(d<200){ vx=-ax*this.getSpeed()*0.8; vy=-ay*this.getSpeed()*0.8; }
          else { vx=ax*this.getSpeed()*0.5; vy=ay*this.getSpeed()*0.5; }
        }
        break;
      case 'snipe':
        this.aimCd -= dt;
        this.chargeCd -= dt;
        if(d<520){
          // 鎖定充能
          if(this.chargeCd<=0){
            this.aimCd = 0.8; // 充能
            // 充能特效線
            this.target = {x:P.x,y:P.y};
            this.chargeCd = rnd(2,3.5);
            this.fireCd = 0.55;
          }
          if(this.fireCd>0){ this.fireCd-=dt; vx=-ax*this.getSpeed()*0.3; vy=-ay*this.getSpeed()*0.3;
            if(this.fireCd<=0.05 && this.target){
              const a = angTo(this.x,this.y,this.target.x,this.target.y);
              ebullets.push({x:this.x,y:this.y,vx:Math.cos(a)*380,vy:Math.sin(a)*380,r:6,dmg:this.proj.dmg,life:3,col:this.proj.col});
              tone(0.05,0.01,0.02,'square',0.05);
              this.target=null;
            }
          } else { vx=ax*this.getSpeed(); vy=ay*this.getSpeed(); }
        } else { vx=ax*this.getSpeed()*0.6; vy=ay*this.getSpeed()*0.6; }
        break;
      case 'bruiser':
        this.chargeCd -= dt;
        if(this.d && this.d< d + 80 && d < 300 && this.chargeCd<=0){ this.charging=0.5; this.chargeCd=rnd(2,3.5); }
        this.d = d;
        if(this.charging>0){ this.charging-=dt; vx=ax*this.getSpeed()*2.6; vy=ay*this.getSpeed()*2.6; }
        else if(d<220){ vx=ax*this.getSpeed()*0.6; vy=ay*this.getSpeed()*0.6; }
        else { vx=ax*this.getSpeed()*0.9; vy=ay*this.getSpeed()*0.9; }
        break;
    }
    // 移動（含碰撞、房間邊界）
    const tot = this.kk>0? this.kk/Math.max(this.kk,0.001) : 1;
    let spdMul = this.kk>0 ? 0 : 1;
    const [nx,ny] = collideCircle(this.x, this.y, this.r, vx*dt, vy*dt);
    this.x=nx; this.y=ny;
    // 碰撞玩家
    if(P.invul<=0 && Math.hypot(P.x-this.x,P.y-this.y)<P.r+this.r && P.alive){
      const a = angTo(this.x,this.y,P.x,P.y);
      P.hurt(this.dmg);
      P.x += Math.cos(a)*14; P.y += Math.sin(a)*14;
    }
    // boss pattern handled by boss override
    if(this.isBoss && this.bossUpdate) this.bossUpdate(dt,P,G);
  }
}
function gameScale(){ return Math.max(1, 1 + (game && game.floor||1)*0.28); }

// ---------- Boss ----------
let BOSS_DEFS = {
  'void 核心': {
    bodyR: 74, hp: 320, spd: 30, dmg: 16, col:'#b46bff',
    parts:{ cannon1:{a:0,d:58}, cannon2:{a:2.1,d:58}, eye:{a:0,d:-6} },
  }
};
function makeBoss(floor, room){
  const cx = room.x+room.w/2, cy = room.y+room.h/2;
  const d = {
    hp: (340 + floor*130) * gameScale(),
  };
  const b = new Enemy('tank', 0,0, room);
  b.isBoss = true; b.type='boss'; b.maxHp = d.hp; b.hp = d.hp;
  b.col = '#b46bff'; b.r = 66; b.score = 500; b.x=cx; b.y=cy;
  b.baseSpd = 24; b.dmg = 16; b.bossFloor=floor;
  b.pattern = { t:0, phase:0, elT:0 };
  b.bossUpdate = function(dt,P,G){
    const pa = this.pattern;
    pa.t += dt;
    // 向量到玩家
    const a = angTo(this.x,this.y,P.x,P.y);
    // 緩慢逼近
    const [nx,ny] = collideCircle(this.x,this.y,this.r, Math.cos(a)*b.baseSpd*dt, Math.sin(a)*b.baseSpd*dt);
    this.x=nx; this.y=ny;
    // 相位移
    const PHA = [1.4, 0.8, 3.2];
    const phase = pa.phase = Math.min(2, Math.floor((this.maxHp-this.hp)/ (this.maxHp/ 3)));
    // 碰撞玩家
    if(P.invul<=0 && Math.hypot(P.x-this.x,P.y-this.y)<P.r+this.r){ P.hurt(this.dmg); }
    // 模式槍口
    pa.elT -= dt;
    if(pa.elT<=0){
      pa.elT = PHA[phase];
      switch(phase){
        case 0: this.burst(CX); break;
        case 1: this.ring(9, 0.09, b.floor*1.2); break;
        case 2: this.radial(P); break;
      }
    }
  };
  b.burst = function(ctx){
    for(let i=0;i<8;i++){
      const a = rnd(TAU);
      ebullets.push({x:this.x,y:this.y,vx:Math.cos(a)*rnd(140,200),vy:Math.sin(a)*rnd(140,200),r:8,dmg:12,life:3,col:'#f8b6ff'});
    }
    tone(0.2,0.05,0.2,'sawtooth',0.08);
  };
  b.ring = function(n, spread, speed){
    for(let i=0;i<n;i++){
      const a = (i/n)*TAU + rnd(-0.03,0.03);
      ebullets.push({x:this.x,y:this.y,vx:Math.cos(a)*speed*130,vy:Math.sin(a)*speed*130,r:6,dmg:10,life:3,col:'#b46bff'});
    }
    noiseBurst(0.15,0.08,0,600);
  };
  b.radial = function(P){
    // 指向玩家的扇形掃射
    const base = angTo(this.x,this.y,P.x,P.y);
    for(let i=0;i<5;i++){
      const a = base + (i-2)*0.2;
      ebullets.push({x:this.x,y:this.y,vx:Math.cos(a)*240,vy:Math.sin(a)*240,r:5,dmg:9,life:2.5,col:'#fe9'});
    }
    // 地板電波
    novas.push({x:this.x,y:this.y,r:20,max:180,dmg:18,t:0.6,hit:new Set(),col:'#b46bff'});
    S.plasma();
  };
  return b;
}

let viewShakeX = 0, viewShakeY = 0;

// ---------- 相機 ----------
function getCam(){
  const P = game && game.player;
  let cx = VW/2, cy = VH/2;
  if(P){ cx = clamp(P.x, VW/2, floorTotalW()-VW/2); cy = clamp(P.y, VH/2, floorTotalH()-VH/2); }
  viewShakeX = viewShakeX*0.8 + (Math.random()-0.5)*shake;
  viewShakeY = viewShakeY*0.8 + (Math.random()-0.5)*shake;
  return { x:cx+viewShakeX, y:cy+viewShakeY };
}
function floorTotalW(){ return floorDef.cw*RM; }
function floorTotalH(){ return floorDef.ch*RM; }

// ---------- 小地圖 ----------
function drawMinimap(cam, ctx){
  const mw = 150, mh = 150, mx = 16, my = VH - mh - 16;
  const sc = mw/floorTotalW();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = 'rgba(4,8,20,.72)'; ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#2a4a6e'; ctx.beginPath(); ctx.roundRect?ctx.roundRect(mx,my,mw,mh,6):ctx.rect(mx,my,mw,mh); ctx.stroke(); ctx.globalAlpha=1;
  const P = game.player;
  for(const r of floorDef.rooms){
    const rx = mx + r.x*sc, ry = my + r.y*sc, rw = r.w*sc, rh = r.h*sc;
    if(r.type==='start') ctx.fillStyle='#3cd28a';
    else if(r.type==='boss') ctx.fillStyle='#e0485a';
    else if(r===game.room) ctx.fillStyle='#6ef';
    else ctx.fillStyle='#1e3a5c';
    ctx.fillRect(rx,ry,rw,rh);
  }
  if(P){
    ctx.fillStyle='#fff';
    const px = mx + P.x*sc, py = my + P.y*sc;
    ctx.beginPath(); ctx.arc(px,py,2.4,0,TAU); ctx.fill();
  }
  // 門
  ctx.strokeStyle='rgba(255,255,255,.4)';
  for(const d of doors){ if(d.locked) continue; ctx.beginPath(); ctx.arc(mx+d.x*sc,my+d.y*sc,2,0,TAU);ctx.stroke(); }
}

// ---------- 房間渲染 ----------
function drawRoom(ctx, drawOffsetX, drawOffsetY){
  const R = game.room;
  const x = R.x - drawOffsetX, y = R.y - drawOffsetY;
  // 房間底色
  const floorCol = R.type==='elite'?'#1a1830':R.type==='treasure'?'#16263a':'#0d1428';
  ctx.fillStyle = floorCol;
  ctx.fillRect(x,y,R.w,R.h);
  // 地板格線
  ctx.strokeStyle='rgba(90,160,255,.07)'; ctx.lineWidth=1;
  for(let gx=x; gx< x+R.w; gx+=40){ ctx.beginPath();ctx.moveTo(gx,y);ctx.lineTo(gx,y+R.h);ctx.stroke(); }
  for(let gy=y; gy< y+R.h; gy+=40){ ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+R.w,gy);ctx.stroke(); }
  // 入口光暈 / 出口標記
  for(const d of doors){
    const dx = d.x-drawOffsetX, dy=d.y-drawOffsetY;
    const c = d.locked? '#2a3a55' : '#6ef';
    ctx.globalAlpha=0.5; ctx.drawImage(glow(c), dx-40, dy-40, 80,80); ctx.globalAlpha=1;
    ctx.fillStyle = d.locked? '#335':'#aef';
    ctx.fillRect(dx-6,dy-14,12,28);
  }
  // 牆
  drawWalls(ctx, drawOffsetX, drawOffsetY);
  // 寶箱
  for(const c of chests){
    const dx = c.x-drawOffsetX, dy=c.y-drawOffsetY;
    ctx.save(); ctx.translate(dx,dy);
    ctx.rotate(0);
    ctx.fillStyle = c.opened? '#4a5a78' : '#b4944e';
    ctx.beginPath(); ctx.roundRect?ctx.roundRect(-13,-11,26,22,6):ctx.rect(-13,-11,26,22); ctx.fill();
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle = c.opened? '#65718c': '#ffd75e';
    ctx.fillRect(-11,-5,22,2);
    if(c.type==='weapon' && !c.opened){ ctx.fillStyle='#7f7'; ctx.font='11px sans'; ctx.textAlign='center'; ctx.fillText('✦',0,17); }
    ctx.restore();
  }
}
function drawWalls(ctx, ox, oy){
  ctx.fillStyle = '#1b2440';
  for(const s of solids){
    const x = s.x-ox, y=s.y-oy;
    ctx.fillRect(x,y,s.w,s.h);

function drawPlayer(ctx, ox, oy){

function drawEnemies(ctx, ox, oy){

    ctx.strokeStyle='rgba(60,255,136,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(game.player.x-ox, game.player.y-oy);
    ctx.lineTo(ex-ox, ey-oy); ctx.stroke();
    ctx.globalAlpha=0.3; ctx.strokeStyle='rgba(60,255,136,.3)'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(game.player.x-ox, game.player.y-oy); ctx.lineTo(ex-ox,ey-oy); ctx.stroke(); ctx.globalAlpha=1;
    for(const e of enemies){
      const k=(e.x-game.player.x)*Math.cos(a)+(e.y-game.player.y)*Math.sin(a);
      const perp=Math.abs(-(e.x-game.player.x)*Math.sin(a)+(e.y-game.player.y)*Math.cos(a));
      if(k>0&&perp<e.r+5){
        // 已處理
      }
    }
  }
}

// ---------- 升級選擇 ----------
function rollUpgrades(){
  if(!game) return null;
  const P = game.player;
  const pool = UPGRADES.filter(u=>!u.once); // simplify
  // 排除過多的同類
  const candidates = [];
  for(let tries=0; tries<80 && candidates.length<3; tries++){
    const u = pick(pool);
    const count = P._upgradeCounts? (P._upgradeCounts[u.id]||0):0;
    if(u.stackCap && count>=u.stackCap) continue;
    if(candidates.find(c=>c.id===u.id)) continue;
    candidates.push(u);
  }
  while(candidates.length<3){ candidates.push(pick(pool)); }
  return candidates.slice(0,3);
}
let pendingUpgrades = null;
function showLevelUp(){
  if(!game) return;
  pendingUpgrades = rollUpgrades();
  const lu = document.getElementById('levelup');
  const box = document.getElementById('luCards');
  box.innerHTML='';
  pendingUpgrades.forEach((u,i)=>{
    const card = document.createElement('div');
    card.className='upcard';
    card.innerHTML='<div class="k">'+(i+1)+'</div><div class="un">'+u.name+'</div><div class="ud">'+u.desc+'</div>';
    card.onclick = ()=> applyUpgrade(u);
    box.appendChild(card);
  });
  lu.classList.remove('hidden');
  game.paused = true;
}
function applyUpgrade(u){
  const lu = document.getElementById('levelup');
  const P = game.player;
  if(u.apply){
    // loot 直接加屬性命中
    if(u.group==='loot'){
      if(u.id==='o_damage') P.finalDmg = P.finalDmg; // no-op, 用 dmgMul
    }
  }
  u.fx(P);
  if(!P._upgradeCounts) P._upgradeCounts = {};
  P._upgradeCounts[u.id] = (P._upgradeCounts[u.id]||0)+1;
  addText(P.x, P.y-40, '獲得：'+u.name, '#ffd75e', 15);
  tone(520,1400,0.25,'triangle',0.07);
  lu.classList.add('hidden');
  pendingUpgrades=null;
  game.paused=false;
}

// ---------- 武器選擇（寶箱/掉落）----------
let pendingWeapon = null;
function spawnWeaponChoice(pos){
  if(!game) return;
  const avail = Object.keys(WEAPONS);
  const have = new Set(game.player.weapons.map(w=>w.name));
  const news = avail.filter(n=>!have.has(n));
  const options = news.length>=2 ? news.slice(0,3) : [pick(avail)];
  // 用升級面板顯示選擇
  pendingUpgrades = null;
  pendingWeapon = options;
  const lu = document.getElementById('levelup');
  const title = document.getElementById('luTitle');
  const lv = document.getElementById('luLv');
  title.textContent = '新武器！！';
  lv.textContent = '選擇一把武器';
  const box = document.getElementById('luCards');
  box.innerHTML='';
  options.forEach((wn,i)=>{
    const w = WEAPONS[wn];
    const card = document.createElement('div');
    card.className='upcard';
    card.innerHTML='<div class="k">'+(i+1)+'</div><div class="un">'+w.icon+' '+w.name+'</div><div class="ud">'+wDesc(wn)+'</div>';
    card.onclick = ()=> applyWeapon(wn);
    box.appendChild(card);
  });
  lu.classList.remove('hidden');
  game.paused = true;
}
function wDesc(n){
  return {'bolt':'直線快射雷射','triple':'三向並行光束','spread':'5 發扇形散射','sniper':'高傷穿透狙擊',
    'laser':'持續相位光束','frost':'放射冰環凍結','missile':'追蹤飛彈三連','nova':'擴張引力新星'}[n]||'';
}
function applyWeapon(wn){
  const lu = document.getElementById('levelup');
  game.player.addWeapon(wn);
  addText(game.player.x, game.player.y-40, '獲得：'+WEAPONS[wn].name, '#7f7', 15);
  lu.classList.add('hidden');
  pendingWeapon=null;
  game.paused=false;
}

// ---------- 結束畫面 ----------
function showWin(G){
  const win = document.getElementById('win');
  document.getElementById('winStats').innerHTML =
    '<div><b>'+G.floor+'</b><span>樓層</span></div><div><b>'+G.kills+'</b><span>擊殺</span></div><div><b>'+G.score+'</b><span>分數</span></div>';
  win.classList.remove('hidden');
  saveBest(G.score);
}
function showGameOver(G){
  const go = document.getElementById('gameover');
  document.getElementById('goStats').innerHTML =
    '<div><b>'+G.floor+'</b><span>樓層</span></div><div><b>'+G.kills+'</b><span>擊殺</span></div><div><b>'+G.score+'</b><span>分數</span></div><div><b>'+G.damage+'</b><span>總傷</span></div>';
  document.getElementById('goBest').textContent = '最高分 ' + (loadBest());
  go.classList.remove('hidden');
  saveBest(G.score);
}
const KEY_BEST = 'deepspace_best';
function loadBest(){ return parseInt(localStorage.getItem(KEY_BEST)||'0',10)||0; }
function saveBest(s){ return localStorage.setItem(KEY_BEST, Math.max(loadBest(),s)); }

// ---------- 主迴圈 ----------
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.033, (t-lastT)/1000 || 0.016);
  lastT = t;
  if(game && game.state==='play' && !game.paused){
    game.update(dt);
    if(typeof shake==='number') shake*=0.9;
    if(flashT>0) flashT-=dt;
    updateParts(dt);
    updateTrail(dt);
  }
  render();
  // pause overlay 可見性
  if(shake<0.1) shake=0;
}
let lastT = 0;

// Pause 控制
function togglePause(){
  if(!game) return;
  if(game.state!=='play') return;
  game.paused = !game.paused;
  const p = document.getElementById('pause');
  if(game.paused){ p.classList.remove('hidden'); } else { p.classList.add('hidden'); }
}

// ---------- UI 綁定 / 初始化 ----------
function initUI(){
  // 職業卡
  const box = document.getElementById('classCards');
  for(const k in CLASSES){
    const c = CLASSES[k];
    const d = document.createElement('div');
    d.className='ccard'+(k===selClass?' sel':'');
    d.dataset.cls=k;
    d.innerHTML='<div class="cn">'+c.icon+' '+c.name+'</div><div class="cd">'+c.desc.replace(/\n/g,'<br>')+'</div>';
    d.onclick = ()=>selectClass(k);
    box.appendChild(d);
  }
  document.getElementById('bestT').textContent = '最高分數：'+loadBest();
  document.getElementById('playBtn').onclick = startGame;
  document.getElementById('retryBtn').onclick = ()=>{ hideOvs(); startGame(); };
  document.getElementById('menuBtn').onclick = ()=>{ hideOvs(); showTitle(); };
  document.getElementById('winBtn').onclick = ()=>{ hideOvs(); startGame(); };
  document.getElementById('resumeBtn').onclick = ()=>{ togglePause(); };
  document.getElementById('quitBtn').onclick = ()=>{ game.paused=false; hideOvs(); showTitle(); };
}
let selClass = 'blaster';
function selectClass(k){ selClass=k; document.querySelectorAll('.ccard').forEach(c=>c.classList.toggle('sel', c.dataset.cls===k)); }
function hideOvs(){ document.querySelectorAll('.ov').forEach(o=>o.classList.add('hidden')); }
function showTitle(){ hideOvs(); document.getElementById('title').classList.remove('hidden'); }

// ---------- 開始遊戲 ----------
function startGame(){
  hideOvs();
  resetArrays();
  makeStars();
  buildUpgrades();
  const rooms = generateFloor(1);
  const start = rooms.find(r=>r.type==='start');
  game = new Game(selClass, 1, start);
  // 職業初始武器
  const starter = { blaster:'bolt', sniper:'sniper', scatter:'spread' }[selClass] || 'bolt';
  game.player.addWeapon(starter);
  banner('第 1 樓層', '探索開始');
}

// ---------- Banner ----------
let bannerT = 0;
function banner(t, s){
  const b = document.getElementById('banner');
  b.innerHTML = t + (s? '<small>'+s+'</small>':'');
  b.classList.add('show');
  clearTimeout(banner._h);
  banner._h = setTimeout(()=> b.classList.remove('show'), 1800);
}

// ---------- Player.hurt ----------
Player.prototype.hurt = function(dmg){
  if(this.invul>0) return;
  const red = 1 - this.armor;
  const final = Math.max(1, dmg*red);
  this.hp -= final;
  game.damage += final;
  this.invul = 0.55;
  addText(this.x, this.y-26, '-'+Math.round(final), '#f66', 15);
  S.hurt(); addShake(6); addFlash(0.12);
};

// ---------- load & boot ----------
buildUpgrades();
initUI();
resize();
requestAnimationFrame(t=>{ lastT=t; loop(t); });
</script>
