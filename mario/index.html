<script>/* ==== c1_core.js ==== */
'use strict';
/* ===== SMB core: constants, canvas scale, input, audio, fixed-step loop ===== */
var TS = 16;                 // tile size
var VW = 256, VH = 240;      // NES screen
var GRAV = 0.45;             // px/frame^2
var GRAV_HOLD = 0.19;        // lighter while rising & A held (variable jump)
var VY_MIN = -4.6;           // jump impulse
var VY_MAX = 5.2;            // terminal fall
var WALK_MAX = 1.45, RUN_MAX = 2.45;
var ACC_GROUND = 0.075, ACC_AIR = 0.055;
var DEC_REL = 0.10, DEC_SKID = 0.19;
var STOMP_V = -3.4, STOMP_VHOLD = -4.3;
var TILE_META = {};          // tile -> {solid, break, coin, power, used}

var cv = document.getElementById('cv');
var cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

function fitCanvas() {
  var availW = window.innerWidth, availH = window.innerHeight;
  // leave room for the touch pad at the bottom on phones
  var pad = (availW < 900 || ('ontouchstart' in window)) ? Math.min(availH * 0.22, 170) : 0;
  var h = availH - pad;
  var s = Math.min(availW / VW, h / VH);
  if (s < 1) s = Math.max(s, 0.4);
  cv.style.width = (VW * s) + 'px';
  cv.style.height = (VH * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 250); });

/* ---------------- input ---------------- */
var IN = { left: 0, right: 0, up: 0, down: 0, A: 0, B: 0, start: 0, sel: 0 };
var INP = { left: 0, right: 0, up: 0, down: 0, A: 0, B: 0, start: 0, sel: 0 }; // prev-frame
function pressed(k) { return IN[k] && !INP[k]; }

var KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  KeyX: 'A', KeyK: 'A', Space: 'A', KeyZ: 'B', KeyJ: 'B',
  Enter: 'start', KeyP: 'start', Escape: 'start'
};
window.addEventListener('keydown', function (e) {
  var k = KEYMAP[e.code];
  if (k) { IN[k] = 1; e.preventDefault(); }
});
window.addEventListener('keyup', function (e) {
  var k = KEYMAP[e.code];
  if (k) { IN[k] = 0; e.preventDefault(); }
});

function bindBtn(id, key) {
  var el = document.getElementById(id);
  if (!el) return;
  var on = function (e) { IN[key] = 1; el.classList.add('on'); e.preventDefault(); };
  var off = function (e) { IN[key] = 0; el.classList.remove('on'); if (e) e.preventDefault(); };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  window.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}
bindBtn('b-left', 'left'); bindBtn('b-right', 'right');
bindBtn('b-a', 'A'); bindBtn('b-b', 'B');

/* ---------------- audio: NES-ish square synth, no assets ---------------- */
var AU = { on: true, ctx: null, master: null };
function audioInit() {
  if (AU.ctx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.16;
    AU.master.connect(AU.ctx.destination);
  } catch (e) { AU.ctx = null; }
}
document.addEventListener('touchstart', function () { audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); }, { passive: true });
window.addEventListener('keydown', function () { audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); });

function tone(freq, dur, type, vol, slideTo) {
  if (!AU.on || !AU.ctx) return;
  var t = AU.ctx.currentTime;
  var o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol == null ? 0.5 : vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.master);
  o.start(t); o.stop(t + dur + 0.02);
}
var SFX = {
  jump: function () { tone(380, 0.16, 'square', 0.5, 780); },
  bigjump: function () { tone(300, 0.20, 'square', 0.5, 900); },
  coin: function () { tone(988, 0.07, 'square', 0.42); setTimeout(function () { tone(1319, 0.32, 'square', 0.42); }, 70); },
  stomp: function () { tone(240, 0.09, 'square', 0.5, 90); },
  bump: function () { tone(160, 0.07, 'square', 0.45, 110); },
  breakblk: function () { tone(600, 0.10, 'square', 0.4, 140); },
  power: function () { [392, 523, 659, 784].forEach(function (f, i) { setTimeout(function () { tone(f, 0.12, 'square', 0.4); }, i * 60); }); },
  grow: function () { [262, 330, 392, 523, 659].forEach(function (f, i) { setTimeout(function () { tone(f, 0.10, 'square', 0.38); }, i * 55); }); },
  shrink: function () { [660, 520, 392, 262].forEach(function (f, i) { setTimeout(function () { tone(f, 0.11, 'square', 0.4); }, i * 55); }); },
  die: function () { tone(660, 0.14, 'square', 0.45); setTimeout(function () { tone(440, 0.18, 'square', 0.45); }, 150); setTimeout(function () { tone(220, 0.5, 'square', 0.45, 110); }, 330); },
  clear: function () { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, 'square', 0.4); }, i * 110); }); },
  kick: function () { tone(900, 0.09, 'square', 0.45, 300); },
  fire: function () { tone(700, 0.08, 'square', 0.35, 220); },
  flag: function () { [392, 523, 659, 880, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.13, 'square', 0.42); }, i * 70); }); }
};

/* ---------------- main loop ---------------- */
var FPS = 60, STEP = 1 / FPS, acc = 0, last = 0, running = false;
var tickHook = null, drawHook = null;
function loop(ts) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (!last) last = ts;
  var dt = (ts - last) / 1000; last = ts;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  var n = 0;
  while (acc >= STEP && n < 5) {
    var k = {};
    for (var key in IN) k[key] = IN[key];
    INP = k;
    if (tickHook) tickHook(STEP);
    acc -= STEP; n++;
  }
  if (drawHook) drawHook();
}
function startLoop() { if (running) return; running = true; last = 0; acc = 0; requestAnimationFrame(loop); }
function stopLoop() { running = false; }
</script>
<script>/* ==== c2_art_mario.js ==== */
'use strict';
/* ===== ART 1: pixel-art helpers, palette, Mario frames =====
   Sprites are authored as 16x16 color-index grids, then baked once into
   offscreen canvases. Palette: classic SMB NES colors.
*/
var PAL = {
  '.': null,
  K: '#000000', W: '#fcffff', w: '#a4e4fc', G: '#00a800', g: '#58d854',
  R: '#e45c10', r: '#fca044', Y: '#f8b800', y: '#f8d878',
  B: '#0058f8', b: '#3cbcfc', C: '#b8f818', c: '#d8f878',
  M: '#f87858', m: '#f0a0a0', O: '#a44000', S: '#503000', P: '#000000',
  N: '#fcb08c'   // SKIN. Was missing entirely -> bake() skipped it silently,
                 // so Mario's whole face/eyes baked as transparent holes.
};
function bake(rows, scale) {
  var h = rows.length, w = rows[0].length;
  var c = document.createElement('canvas');
  c.width = w * (scale || 1); c.height = h * (scale || 1);
  var g = c.getContext('2d');
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
    var ch = rows[y][x];
    if (ch === '.' || !PAL[ch]) continue;
    g.fillStyle = PAL[ch];
    g.fillRect(x * (scale || 1), y * (scale || 1), scale || 1, scale || 1);
  }
  return c;
}

/* ---------- palette-swap a baked sprite (for fire Mario variants) ---------- */
function swap(src, map) {
  var c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  var g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  var d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  var from = [], to = [];
  for (var key in map) {
    var a = hex(map[key]), b = hex(PAL[key] || '#000000');
    from.push(a); to.push(b);
  }
  for (var i = 0; i < p.length; i += 4) {
    if (p[i + 3] === 0) continue;
    var cnum = (p[i] << 16) | (p[i + 1] << 8) | p[i + 2];
    for (var f = 0; f < from.length; f++) if (cnum === from[f]) { cnum = to[f]; break; }
    p[i] = (cnum >> 16) & 255; p[i + 1] = (cnum >> 8) & 255; p[i + 2] = cnum & 255;
  }
  g.putImageData(d, 0, 0);
  return c;
}
function hex(h) { return parseInt(h.slice(1), 16); }

  g.fillStyle = PAL.r; g.fillRect(x + 2, y + 2, 5, 4); g.fillRect(x + 9, y + 2, 5, 4);
  g.fillRect(x + 2, y + 10, 4, 4); g.fillRect(x + 8, y + 10, 6, 4);
}
function drawSolidBlock(g, x, y, o) {

}

'use strict';
/* ===== LEVEL BUILDER =====
   Levels are built procedurally from SMB's real object coordinates, which is
   far less error-prone than hand-typed 128-column ASCII rows.
   Screen is 16 tiles wide (256px), 15 tiles tall (240px).
   Ground surface occupies rows 15-16 (y=240..272); row 13 is the first
   free-standing row above ground in SMB.
*/
var GRID_H = 15;   // visible + 2 rows of ground below

function Level(w, opt) {

  if (dirIn !== 0) {
    if (this.autoWalk) {
      this.vx = dirIn * Math.max(Math.abs(this.vx), 0.55);
    } else {
      var turning = (this.vx > 0 && dirIn < 0) || (this.vx < 0 && dirIn > 0);
      this.skidding = false;
      if (this.onGround && turning && Math.abs(this.vx) > 0.6) {
        this.vx += dirIn * DEC_SKID;
        this.skidding = true;
        if (Math.abs(this.vx) < 0.25) this.vx = 0;
      } else {
        this.vx += dirIn * acc;
        if (Math.abs(this.vx) > maxSpd) this.vx = dirIn * maxSpd;
        this.skidding = false;
      }
    }
    if (!this.facingLocked) this.dir = dirIn;
  } else if (!this.autoWalk) {
    this.skidding = false;
    if (this.onGround) {
      var d = Math.abs(this.vx) < DEC_REL ? DEC_REL : DEC_REL;
      if (Math.abs(this.vx) <= d) this.vx = 0; else this.vx -= Math.sign(this.vx) * d;
    } else {
      if (Math.abs(this.vx) <= DEC_REL * 0.5) this.vx = 0; else this.vx -= Math.sign(this.vx) * DEC_REL * 0.5;
    }
  }

  // --- jump ---
  if (this.autoWalk === 0) {
    if (IN.A && this.onGround && !this.jumping) {
      this.vy = VY_MIN - (Math.abs(this.vx) > 1.6 ? 0.55 : 0);
      this.onGround = false; this.jumping = true; this.jumpHoldFrames = 0;
      if (this.power === PWR.SMALL) SFX.jump(); else SFX.bigjump();
    }
    if (!IN.A && this.jumping && this.vy < 0) {
      // cut the jump short (variable jump height)
      this.vy += 0.55; this.jumpHoldFrames++;
    }
  }
  // gravity
  var g = GRAV;
  if (this.vy < 0 && IN.A && this.jumping) g = GRAV_HOLD;
  this.vy += g;
  if (this.vy > VY_MAX) this.vy = VY_MAX;

  // --- move X ---
  var nx = this.x + this.vx;
  var W2 = W;
  if (this.vx > 0) {
    var edge = nx + this.w;
    var hitR = false;
    for (var ty = Math.floor(b.y / TS); ty <= Math.floor((b.y + b.h - 1) / TS); ty++) {
      if (W2.solidAtPx(edge, ty * TS + 2) || W2.solidAtPx(edge, ty * TS + 8)) { hitR = true; break; }
    }
    if (hitR) {
      var txr = Math.floor((edge - 1) / TS);
      nx = txr * TS - this.w;
      this.vx = 0;
    }
  } else if (this.vx < 0) {
    var edgeL = nx;
    var hitL = false;
    for (var ty2 = Math.floor(b.y / TS); ty2 <= Math.floor((b.y + b.h - 1) / TS); ty2++) {
      if (W2.solidAtPx(edgeL, ty2 * TS + 2) || W2.solidAtPx(edgeL, ty2 * TS + 8)) { hitL = true; break; }
    }
    if (hitL) {
      var txl = Math.floor((edgeL + 1) / TS);
      nx = (txl + 1) * TS;
      this.vx = 0;
    }
  }
  // level left wall
  if (nx < 0) { nx = 0; this.vx = 0; }
  this.x = nx;

  // --- move Y ---
  var ny = this.y + this.vy;
  this.onGround = false;
  var b2 = this.box();
  if (this.vy >= 0) {
    var foot = ny + this.h;   // this.h = feet anchor; box() grows upward for big
    var tx0 = Math.floor((b2.x + 1) / TS), tx1 = Math.floor((b2.x + b2.w - 2) / TS);
    var tyF = Math.floor(foot / TS);
    var hitF = false;
    for (var tx = tx0; tx <= tx1; tx++) {
      if (W2.solidAtPx(tx * TS + 4, foot) || W2.solidAtPx(tx * TS + 10, foot)) { hitF = true; break; }
    }
    if (hitF) {
      ny = tyF * TS - this.h;
      this.onGround = true; this.jumping = false; this.vy = 0;
    }
  } else {
    var top = ny - (b2.h - this.h);   // box top: big is 8px taller than this.h
    var txa = Math.floor((b2.x + 1) / TS), txb = Math.floor((b2.x + b2.w - 2) / TS);
    var tya = Math.floor(top / TS);
    var hitC = null;
    for (var tx2 = txa; tx2 <= txb; tx2++) {
      var ch = W2.atTile(tx2, tya);
      if (isSolid(ch)) { hitC = { tx: tx2, ty: tya, ch: ch }; break; }
    }
    if (hitC) {
      ny = (hitC.ty + 1) * TS + (b2.h - this.h);   // keep the box top flush with the ceiling
      this.vy = 0.1;
      Game.bumpBlock(hitC.tx, hitC.ty, hitC.ch, this);
    }
  }
  this.y = ny;

  // --- anim ---
  this.animT++;
  if (Math.abs(this.vx) > 0.15 && this.onGround) {
    if (this.animT % 4 === 0) this.anim++;
  } else if (this.onGround) {
    this.anim = 0;
  }
  if (this.invuln > 0) this.invuln--;
  if (this.fireCd > 0) this.fireCd--;
};

Player.prototype.hurt = function () {
  if (this.invuln > 0 || this.dead) return false;
  if (this.power === PWR.SMALL) { this.die(); return true; }
  // shrink
  this.power = PWR.SMALL;
  this.invuln = 120;
  this.growT = 40;
  SFX.shrink();
  return true;
};
Player.prototype.grow = function (to) {
  var oldH = this.bigH();
  this.power = to;
  this.growT = 30;
  SFX.grow();
};
Player.prototype.die = function () {
  if (this.dead) return;
  this.dead = true; this.deadT = 0; this.vy = -6.2; this.vx = 0;
  this.power = PWR.SMALL;
  SFX.die();
};
Player.prototype.fire = function () {
  if (this.power !== PWR.FIRE || this.fireCd > 0 || !this.onGround && false) return false;
  if (this.fireCd > 0) return false;
  var b = this.box();
  var fb = {
    x: this.dir > 0 ? b.x + b.w + 1 : b.x - 9,
    y: b.y + (this.crouching ? 12 : 4),
    vx: this.dir * 3.4, vy: 0.6,
    life: 190
  };
  this.fireballs.push(fb);
  this.fireCd = 14;
  SFX.fire();
  return true;
};
</script>
<script>/* ==== c9_enemy.js ==== */
'use strict';
/* ===== ENEMIES + ITEMS =====
   Shared base for walkers (goomba, koopa) with SMB rules:
   - walk forward, turn at walls and ledges (koopa turns at ledges, goomba does not)
   - stomping flips/kills them; touching hurts the player
*/
function EnemyBase(x, y, type) {
  this.type = type;
  this.x = x; this.y = y;
  this.vx = -0.42; this.vy = 0;
  this.w = 16; this.h = 16;
  this.dead = false; this.deadT = 0;
  this.squashT = 0;
  this.flip = false;
  this.anim = 0; this.animT = 0;
  this.active = false;   // becomes active when near camera
  this.mode = 'walk';     // walk | shell | shellSlide | flip | off
  this.stompable = true;
  this.gravityOn = true;
}
EnemyBase.prototype.box = function () {
  return { x: this.x, y: this.y, w: this.w, h: this.h };
};

function Goomba(x, y) { EnemyBase.call(this, x, y, 'goomba'); }
Goomba.prototype = Object.create(EnemyBase.prototype);
Goomba.prototype.constructor = Goomba;
Goomba.prototype.squash = function () {
  this.squashT = 30; this.stompable = false; this.vx = 0;
  SFX.stomp();
};
Goomba.prototype.killFlip = function () { this.flip = true; this.vy = -3.4; this.stompable = false; SFX.stomp(); };

function Koopa(x, y) { EnemyBase.call(this, x, y, 'koopa'); this.w = 16; this.h = 24; this.baseY = y; this.footY = y + 24; }
Koopa.prototype = Object.create(EnemyBase.prototype);
Koopa.prototype.constructor = Koopa;
Koopa.prototype.squash = function () {
  // turn into a shell: hitbox becomes 16x16, feet stay on the same ground line
  this.mode = 'shell';
  this.h = 16; this.w = 16;
  this.y = this.footY - 16;
  this.vx = 0; this.stompable = true;
  SFX.stomp();
};
Koopa.prototype.killFlip = function () { this.flip = true; this.vy = -3.4; this.stompable = false; SFX.stomp(); };
Koopa.prototype.wake = function () {
  // re-inflate: hitbox back to 16x24 with the same feet line
  this.mode = 'walk'; this.h = 24; this.w = 16; this.y = this.footY - 24;
  this.vx = this.dirSave || -0.42;
  this.stompable = true;
};

EnemyBase.prototype.update = function (W, G) {
  if (this.dead && this.deadT > 0) {
    this.deadT--;
    if (this.mode === 'off' && this.deadT <= 0) this.remove = true;
    return;
  }
  // flip-death arc
  if (this.flip) {
    this.y += this.vy; this.vy += 0.32;
    if (this.type === 'goomba' || (this.type === 'koopa' && this.mode === 'shell')) {
      // offscreen removal handled below
    }
    this.x += this.vx * 0.6;
    if (this.y > VH + 80) this.remove = true;
    return;
  }
  if (this.squashT > 0) {
    this.squashT--;
    if (this.squashT === 0) this.mode = 'off';
    return;
  }
  if (this.mode === 'off') return;

  // activate when on screen (or close)
  var camX = G.cam.x;
  if (!this.active) {
    if (this.x + this.w > camX - 32 && this.x < camX + VW + 32) this.active = true;
    else return;
  }

  // gravity
  if (this.mode !== 'shellStill') {
    this.vy += 0.32;
    if (this.vy > 5) this.vy = 5;
  }
  // walk speed by mode
  if (this.mode === 'walk') this.vx = this.vx < 0 ? -0.42 : 0.42;
  else if (this.mode === 'shellSlide') { this.vx = this.vx < 0 ? -2.6 : 2.6; }

  // horizontal move + wall turn
  var nx = this.x + this.vx;
  var probeY0 = this.y + 2, probeY1 = this.y + this.h - 2;
  var hitWall = false;
  if (this.vx > 0) {
    if (W.solidAtPx(nx + this.w, probeY0) || W.solidAtPx(nx + this.w, probeY1)) hitWall = true;
  } else if (this.vx < 0) {
    if (W.solidAtPx(nx, probeY0) || W.solidAtPx(nx, probeY1)) hitWall = true;
  }
  if (hitWall && this.mode !== 'shellSlide') {
    // blocked: turn around, don't move into the wall this frame.
    // (was inverted -- `else nx = this.x` made enemies move ONLY on the frame
    //  they hit a wall, so they stood still on open ground)
    this.vx = -this.vx; nx = this.x;
  }
  this.x = nx;
  if (this.x < 0) { this.x = 0; this.vx = Math.abs(this.vx); }

  // vertical
  var ny = this.y + this.vy;
  var tyF = Math.floor((ny + this.h) / TS);
  var hitF = false;
  var tx0 = Math.floor((this.x + 1) / TS), tx1 = Math.floor((this.x + this.w - 2) / TS);
  for (var tx = tx0; tx <= tx1; tx++) {
    if (W.solidAtPx(tx * TS + 4, ny + this.h) || W.solidAtPx(tx * TS + 10, ny + this.h)) { hitF = true; break; }
  }
  if (hitF && this.vy >= 0) {
    ny = tyF * TS - this.h;
    // koopa shells rest on ground
    if (this.mode === 'shell' || this.mode === 'shellSlide') { this.vy = 0; this.shellRest = true; }
    else this.vy = 0;
  } else if (this.mode === 'shell' || this.mode === 'shellSlide') {
    this.vy = 0.0001;
  }
  this.y = ny;

  // ledge turn for walkers (koopa/goomba in SMB: goomba walks off; koopa turns)
  if (this.mode === 'walk' && this.shellRest !== true) {
    var onGround = this.onGroundNow(W);
    if (!onGround) {
      // koopa turns at ledge, goomba does not
      if (this.type === 'koopa') { this.vx = -this.vx; this.x += this.vx * 0.5; }
    }
  }
  this.shellRest = false;

  // remove if far offscreen behind
  if (this.x < camX - 120) this.remove = true;
  this.animT++;
  if (this.animT % 8 === 0) this.anim ^= 1;
};
EnemyBase.prototype.onGroundNow = function (W) {
  var footY = this.y + this.h;
  var tx0 = Math.floor((this.x + 1) / TS), tx1 = Math.floor((this.x + this.w - 2) / TS);
  for (var tx = tx0; tx <= tx1; tx++) {
    if (W.solidAtPx(tx * TS + 4, footY) || W.solidAtPx(tx * TS + 10, footY)) return true;
  }
  return false;
};

/* ---------- items ---------- */
function ItemBase(x, y, type) {
  this.x = x; this.y = y; this.vy = 0; this.vx = 0;
  this.type = type;        // mushroom | oneup | star | coin
  this.emerge = 0;         // frames rising out of block
  this.emergeFrom = y;
  this.collected = false;
  this.remove = false;
  this.active = false;
  this.dir = 1;
  this.life = 0;
}
ItemBase.prototype.update = function (W, G) {
  if (this.collected) { this.remove = true; return; }
  var camX = G.cam.x;
  if (!this.active) {
    if (this.x > camX - 48 && this.x < camX + VW + 64) this.active = true;
    else return;
  }
  if (this.emerge > 0) {
    this.emerge--;
    this.y = this.emergeFrom - (1 - this.emerge / 16) * 16;
    return;
  }
  if (this.type === 'coin' || this.type === 'star') {
    if (this.type === 'star') {
      this.vy += 0.3; this.y += this.vy;
      var fy = this.y + 16;
      var tx0 = Math.floor((this.x + 1) / TS), tx1 = Math.floor((this.x + 14) / TS);
      var hit = false;
      for (var tx = tx0; tx <= tx1; tx++) if (W.solidAtPx(tx * TS + 4, fy) || W.solidAtPx(tx * TS + 10, fy)) hit = true;
      if (hit) { this.y = Math.floor((this.y + 16) / TS) * TS - 16; this.vy = -2.6; this.vx += 0.2; if (this.vx > 2.6) this.vx = 2.6; }
      this.x += this.vx;
      if (this.x < camX) { this.vx = Math.abs(this.vx); }
      this.life++;
      if (this.life > 600) this.remove = true;
    }
    return;
  }
  // mushroom/1up: walk with gravity, turn at walls
  this.vy += 0.32; if (this.vy > 5) this.vy = 5;
  var nx = this.x + this.vx;
  if (this.vx > 0 && (W.solidAtPx(nx + 16, this.y + 4) || W.solidAtPx(nx + 16, this.y + 12))) this.vx = -Math.abs(this.vx);
  else if (this.vx < 0 && (W.solidAtPx(nx, this.y + 4) || W.solidAtPx(nx, this.y + 12))) this.vx = Math.abs(this.vx);
  else this.x = nx;
  var ny = this.y + this.vy;
  var tyF = Math.floor((ny + 16) / TS);
  var hitF = false;
  for (var tx2 = Math.floor((this.x + 1) / TS); tx2 <= Math.floor((this.x + 14) / TS); tx2++)
    if (W.solidAtPx(tx2 * TS + 4, ny + 16) || W.solidAtPx(tx2 * TS + 10, ny + 16)) hitF = true;
  if (hitF) { ny = tyF * TS - 16; this.vy = 0; } else this.y = ny;
  if (this.y < 0) this.remove = true;
  this.life++;
  if (this.life > 900) this.remove = true;
};
ItemBase.prototype.box = function () { return { x: this.x, y: this.y, w: 16, h: 16 }; };
</script>
<script>/* ==== c10_render.js ==== */
'use strict';
/* ===== RENDERER =====
   Draws the tile map + decor + entities to the 256x240 canvas.
*/
function Render(G) {
  var W = G.world, L = G.level, cam = G.cam;
  cx.fillStyle = L.underground ? '#000000' : L.sky;
  cx.fillRect(0, 0, VW, VH);

  // parallax-ish background (SMB uses static bg + hills; hills scroll slower)
  var bgOff = Math.floor(cam.x * 0.5);
  var bgW = cam.x * 0.5;
  for (var i = 0; i < L.decor.length; i++) {
    var d = L.decor[i];
    var sx = d.x * TS - Math.floor(bgOff * (d.t === 'hillB' || d.t === 'hillS' ? 1 : 1));
    // SMB: background scrolls at same rate; only distant clouds are static. Keep same for fidelity.
    sx = d.x * TS - Math.floor(cam.x);
    if (sx > -40 && sx < VW + 40) {
      if (d.t === 'cloud') cx.drawImage(SPR.cloud[d.k % 3], Math.round(sx), Math.round(d.y * TS));
      else if (d.t === 'bush') cx.drawImage(SPR.bush[d.k % 3], Math.round(sx), Math.round(d.y * TS));
      else if (d.t === 'hillB') cx.drawImage(SPR.hillBig, Math.round(sx), Math.round(d.y * TS));
      else if (d.t === 'hillS') cx.drawImage(SPR.hillSmall, Math.round(sx), Math.round(d.y * TS));
    }
  }

  // tile map
  var x0 = Math.max(0, Math.floor(cam.x / TS));
  var x1 = Math.min(L.w - 1, Math.ceil((cam.x + VW) / TS));
  for (var y = 0; y < L.h; y++) {
    for (var x = x0; x <= x1; x++) {
      var ch = W.g[y][x];
      if (ch === ' ') continue;
      var px = x * TS - cam.x, py = y * TS;
      var off = W.bumpOffset(x, y);
      py += off;
      switch (ch) {
        case 'X': cx.drawImage(SPR.t_ground, px, py); break;
        case 'B': cx.drawImage(SPR.t_brick, px, py); break;
        case 'b': cx.drawImage(SPR.t_brick, px, py); break;
        case '?': cx.drawImage(SPR.t_q, px, py); break;
        case 'M': cx.drawImage(SPR.t_q, px, py); break;
        case 'U': cx.drawImage(SPR.t_q, px, py); break;
        case 'T': break; // hidden block: invisible
        case 'P': {
          // pipe top-left: scan the shaft, draw head+body once for both columns
          var ph = 1;
          while (W.atTile(x, y + ph) === 'L' || W.atTile(x, y + ph) === 'R') ph++;
          var pi = Math.max(0, Math.min(3, ph - 2));
          cx.drawImage(SPR.pipe[pi].head, px, py);
          cx.drawImage(SPR.pipe[pi].body, px, py + 16);
          break;
        }
        case 'p': break;  // pipe top-right: drawn with 'P'
        case 'L': break;  // pipe shaft: drawn with 'P'
        case 'R': break;
        case 'S': cx.drawImage(SPR.t_solid, px, py); break;
        case 's': cx.drawImage(SPR.t_solid_b, px, py); break;
        case '=': cx.drawImage(SPR.t_solid_b, px, py); break;
        case 'o': drawWorldCoin(px, py + 4, G.frame); break;
        case 'l': cx.fillStyle = '#f83800'; cx.fillRect(px, py + 8, 16, 8); cx.fillStyle = '#fc9838'; cx.fillRect(px, py + 11, 16, 3); break;
        case 'd': drawFireBar(px, py, G.frame); break;
        default: break;
      }
    }
  }

  // used blocks (drawn over map)
  for (var key in W.coinUsed) {
    var kp = key.split(',');
    var kx = parseInt(kp[0]), ky = parseInt(kp[1]);
    var kpx = kx * TS - cam.x;
    if (kpx > -20 && kpx < VW) cx.drawImage(SPR.t_used, kpx, ky * TS + W.bumpOffset(kx, ky));
  }

  // free-standing items
  for (var it = 0; it < G.items.length; it++) {
    var I = G.items[it];
    if (I.remove) continue;
    var ix = I.x - cam.x, iy = I.y;
    if (I.type === 'coin') drawWorldCoin(ix, iy + 4, G.frame);
    else if (I.type === 'star') { cx.save(); cx.translate(ix + 8, iy + 8); cx.rotate(G.frame * 0.15); cx.drawImage(SPR.item.star, -8, -8); cx.restore(); }
    else cx.drawImage(I.type === 'oneup' ? SPR.item.oneup : (I.type === 'fire' ? SPR.item.fire : SPR.item.mushroom), Math.round(ix), Math.round(iy));
  }

  // flag pole
  if (!L.noFlag) {
    var fx = L.flagX * TS + 8 - cam.x;
    var fBase = (GRID_H - 2) * TS;
    // pole
    cx.fillStyle = '#00a800'; cx.fillRect(fx + 4, fBase - 8 * TS, 3, 8 * TS);
    cx.fillStyle = '#a4e4fc'; cx.fillRect(fx + 5, fBase - 8 * TS, 1, 8 * TS);
    // ball on top
    cx.fillStyle = '#f8b800'; cx.beginPath(); cx.arc(fx + 5, fBase - 8 * TS - 3, 4, 0, 7); cx.fill();
    cx.fillStyle = '#000'; cx.fillRect(fx + 3, fBase - 8 * TS - 5, 5, 2);
    // flag (only while player hasn't grabbed)
    if (!G.flagGrabbed) {
      var fy = G.flagY != null ? G.flagY : fBase - 5 * TS;
      cx.drawImage(SPR.flag, fx + 6, fy);
    }
  }

  // castle
  var csx = L.castleX * TS - cam.x;
  if (csx > -80 && csx < VW + 40) {
    cx.drawImage(L.castleSmall ? SPR.castleSmall : SPR.castleBig, Math.round(csx), Math.round((GRID_H - 2) * TS - (L.castleSmall ? 48 : 80)));
  }

  // enemies
  for (var e = 0; e < G.enemies.length; e++) {
    var en = G.enemies[e];
    if (en.remove) continue;
    var ex = Math.round(en.x - cam.x);
    if (ex < -24 || ex > VW + 24) continue;
    drawEnemy(en, ex);
  }

  // fireballs
  for (var fb = 0; fb < G.player.fireballs.length; fb++) {
    var F = G.player.fireballs[fb];
    cx.drawImage(SPR.fireball, Math.round(F.x - cam.x), Math.round(F.y));
  }

  // player
  var p = G.player;
  if (!p.hidden) {
    var ppx = Math.round(p.x - cam.x);
    var ppy = Math.round(p.y);
    if (p.invuln > 0 && Math.floor(G.frame / 2) % 2 === 0 && !p.dead) { /* blink */ }
    else drawPlayer(p, ppx, ppy, G.frame);
  }

  // score/time popups
  for (var q = 0; q < G.popups.length; q++) {
    var pp = G.popups[q];
    cx.fillStyle = '#fff'; cx.font = '8px monospace'; cx.textAlign = 'center';
    cx.globalAlpha = Math.max(0, pp.life / 30);
    cx.fillText(pp.text, Math.round(pp.x - cam.x), Math.round(pp.y));
    cx.globalAlpha = 1;
  }
}

function drawWorldCoin(px, py, frame) {
  var f = Math.floor(frame / 8) % 4;
  drawCoin(cx, px, py, f);
}
function drawPlayer(p, px, py, frame) {
  var set = p.power === PWR.SMALL ? SPR.mario : (p.power === PWR.FIRE ? SPR.fire : SPR.big);
  var img;
  if (p.dead) img = (p.power === PWR.SMALL ? SPR.mario : SPR.big).die;
  else if (p.crouching) img = set.crouch;

  },
  toTitle: function () {
    this.state = 'title';

  }

'use strict';
/* ===== UI: title screen, HUD, overlays, boot ===== */
function updateHUD() {
  var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
  if (Game.level) set('h-lv', Game.level.name || ('WORLD ' + (Game.li + 1)));
  set('h-coin', '×' + (Game.coins < 10 ? '0' : '') + Game.coins);
  var s = Game.score;
  var str = '';
  for (var i = 6; i >= 0; i--) { str += (Math.floor(s / Math.pow(10, i)) % 10); }
  set('h-score', str);
}

/* ---- title screen overlay ---- */
var uiOv = null;
function showOverlay(html, opts) {
  hideOverlay();
  opts = opts || {};
  var d = document.createElement('div');
  d.id = 'overlay';
  d.style.cssText = 'position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;' +
    'align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.72);text-align:center;padding:5vh 6vw';
  d.innerHTML = html;
  if (opts.onTap) {
    d.addEventListener('click', function (ev) { ev.preventDefault(); opts.onTap(); }, { passive: false });
    d.addEventListener('touchstart', function (ev) { ev.preventDefault(); opts.onTap(); }, { passive: false });
  }
  document.body.appendChild(d);
  uiOv = d;
  return d;
}
function hideOverlay() { if (uiOv) { uiOv.remove(); uiOv = null; } }

function titleScreen() {
  var hi = Game.hiScore || 0;
  var html =
    '<div style="font-size:min(9vw,44px);font-weight:bold;color:#e45c10;text-shadow:3px 3px 0 #fff,6px 6px 0 #000;letter-spacing:1px">' +
    'SUPER<br>MARIO BROS.</div>' +
    '<div style="font-size:min(4vw,16px);color:#f8d878">還原版 · 手機可玩</div>' +
    '<div style="font-size:min(3.4vw,14px);color:#aaa;line-height:1.9">' +
    '◀ ▶ 移動　　B 跑／衝刺<br>' +
    'A 跳（長按跳更高）<br>' +
    '火焰瑪莉：按 B 發射火球' +
    '</div>' +
    '<div style="font-size:min(3.4vw,14px);color:#8f8">最高分：' + hi + '</div>' +
    '<div class="chip" style="margin-top:6px;font-size:min(5vw,20px);padding:2vh 8vw">▶ 開始遊戲</div>' +
    '<div style="font-size:min(2.8vw,12px);color:#777;margin-top:2vh">點 anywhere 或按 Enter / A 開始</div>';
  showOverlay(html, { onTap: startGame });
}

function startGame() {
  hideOverlay();
  audioInit();
  Game.score = 0; Game.coins = 0; Game.lives = 3;
  Game.levels = buildAllLevels();
  // load mid-level power only on continue; fresh game starts small
  Game.startLevel(0, false);
  SFX.power();
}

function gameOverScreen() {
  var won = Game.gameWon;
  var html =
    '<div style="font-size:min(8vw,38px);font-weight:bold;color:#fff">' +
    (won ? 'YOU SAVE THE KINGDOM!' : 'GAME OVER') + '</div>' +
    '<div style="font-size:min(4.6vw,20px);color:#f8d878">得分：' + Game.score + '</div>' +
    '<div style="font-size:min(3.4vw,14px);color:#aaa">金幣：' + Game.coins + '　生命：' + Game.lives + '</div>' +
    '<div class="chip" style="font-size:min(4.4vw,18px);padding:1.6vh 7vw;margin-top:4px">再玩一次</div>';
  showOverlay(html, { onTap: function () { hideOverlay(); titleScreen(); } });
  setTimeout(function () { if (Game.state === 'gameover') { /* keep showing */ } }, 100);
}

/* HUD top-right lives display */
function drawHUDOverlay() {
  // lives shown via DOM chip? add lives into coin chip area — simpler: overlay text top-left
  cx.font = '8px monospace'; cx.textAlign = 'left';
  cx.fillStyle = '#fff';
  cx.fillText('x' + Game.lives, 2, 8);
  cx.textAlign = 'right';
  cx.fillText(Game.level ? (Game.level.name || '') : '', VW - 2, 8);
}

/* ---- boot ---- */
function boot() {
  buildSprites();
  fitCanvas();
  Game.hiScore = 0;
  try { Game.hiScore = parseInt(localStorage.getItem('smb_hi') || '0') || 0; } catch (e) {}
  Game.levels = buildAllLevels();
  tickHook = function (dt) {
    if (Game.state === 'title') { Game.frame++; return; }
    Game.update(dt);
  };
  drawHook = function () {
    if (Game.state === 'title') { drawTitleBackdrop(); drawTitleText(); return; }
    if (Game.state === 'gameover') { drawBackdropFromLevel(); drawGameOverText(); return; }
    Render(Game);
    drawHUDOverlay();
    if (Game.state === 'dying') { cx.fillStyle='rgba(0,0,0,.0)'; }
  };
  startLoop();
  titleScreen();
}

/* title: render level 1-1 as a live backdrop */
function drawTitleBackdrop() {
  if (!Game.levels.length) Game.levels = buildAllLevels();
  if (!Game.world) {
    Game.level = Game.levels[0];
    Game.world = new World(Game.level);
    Game.enemies = [];
    for (var e = 0; e < Game.level.enemies.length; e++) {
      var ed = Game.level.enemies[e];
      Game.enemies.push(ed.type === 'goomba' ? new Goomba(ed.x * TS, ed.y * TS) : new Koopa(ed.x * TS, ed.y * TS - 8));
    }
    Game.items = [];
    Game.popups = [];
    Game.player = new Player(2 * TS, 12 * TS);
    Game.cam.x = 0;
  }
  // slowly pan camera + run enemies for a live feel
  Game.frame++;
  Game.cam.x = (Game.frame * 0.35) % Math.max(1, (Game.level.w - 16) * TS);
  for (var i = 0; i < Game.enemies.length; i++) Game.enemies[i].update(Game.world, Game);
  Render(Game);
}
function drawTitleText() {
  // overlay darkening + big text drawn by DOM overlay already; keep canvas clean
}
function drawBackdropFromLevel() {
  if (Game.world) Render(Game);
}
function drawGameOverText() {}

// ---- input hooks for title / start ----
window.addEventListener('keydown', function (e) {
  if (Game.state === 'title' && (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyX')) startGame();
  if (Game.state === 'gameover' && (e.code === 'Enter' || e.code === 'Space')) { hideOverlay(); titleScreen(); }
});

/* pause button */
document.getElementById('b-pause').addEventListener('click', function () {
  if (Game.state === 'playing') {
    showOverlay('<div style="font-size:min(7vw,32px);font-weight:bold">暫停 PAUSED</div>' +
      '<div class="chip" style="font-size:min(4vw,16px);padding:1.4vh 6vw">繼續 / 回到標題</div>', {
      onTap: function () {
        hideOverlay();
        Game.state = 'playing';
      }
    });
    Game.state = 'paused';
  }
});
document.getElementById('b-mute').addEventListener('click', function (e) {
  e.stopPropagation();
  AU.on = !AU.on;
  this.textContent = AU.on ? '🔊' : '🔇';
});
document.getElementById('b-fs').addEventListener('click', function () {
  var el = document.documentElement;
  if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen(); }
  else if (document.exitFullscreen) document.exitFullscreen();
});

// watch for gameover -> show overlay once
var _prevState = '';
function stateWatch() {
  if (Game.state === 'gameover' && _prevState !== 'gameover') gameOverScreen();
  _prevState = Game.state;
  setTimeout(stateWatch, 120);
}
setTimeout(stateWatch, 300);

boot();
</script>
<script></script>
</body>
